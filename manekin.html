<title>Dairecto Manekin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* Szara karta 18%. Tryb wideo zmienia tylko tokeny. */
  :root {
    color-scheme: light;
    --bg: #D6D6D6;
    --tile: #EDEDED;
    --tile-line: #B5B5B5;
    --ink: #1E1E1E;
    --muted: #4A4A4A;
    --selected: #1E1E1E;
    --on-selected: #F2F2F2;
    --fig-body: #F7F7F5;
    --fig-line: #1E1E1E;
    --glow: #FFFFFF;
    --font: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  body[data-mode="video"] {
    --bg: #8A8A8A;
    --tile: #A2A2A2;
    --tile-line: #6E6E6E;
    --muted: #262626;
  }

  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.4;
    padding: 0 16px;
    overflow: hidden;
  }
  .app {
    height: 100%;
    max-width: 640px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-block: 10px;
  }

  /* Pasek górny */
  .top { display: flex; align-items: center; gap: 10px; }
  h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
  .modes { display: flex; gap: 4px; margin-left: auto; }
  .chip {
    font: inherit; font-size: 13px; font-weight: 700;
    color: var(--ink); background: var(--tile);
    border: 1px solid var(--tile-line); border-radius: 6px;
    padding: 7px 10px; cursor: pointer;
    display: flex; align-items: center; gap: 6px;
  }
  .chip[aria-pressed="true"] { background: var(--selected); border-color: var(--selected); color: var(--on-selected); }
  .patch { width: 10px; height: 10px; border-radius: 2px; flex: none; }
  #copy { white-space: nowrap; background: var(--selected); border-color: var(--selected); color: var(--on-selected); }

  /* Podgląd */
  .stage { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 4px; }
  #preview { flex: 1; min-height: 0; width: 100%; display: block; }
  .readout {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    font-variant-numeric: tabular-nums; text-align: center;
    display: flex; justify-content: center; align-items: center; gap: 6px;
  }
  .rec { width: 7px; height: 7px; border-radius: 50%; background: #AF363C; }

  /* Panel opcji */
  .panel {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: minmax(92px, 116px);
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 2px;
  }
  .tile {
    font: inherit; color: var(--ink);
    background: var(--tile); border: 1px solid var(--tile-line); border-radius: 6px;
    padding: 8px 6px; cursor: pointer;
    display: grid; justify-items: center; align-content: start; gap: 4px;
  }
  .tile[aria-pressed="true"] { background: var(--selected); border-color: var(--selected); color: var(--on-selected); }
  .tile svg { display: block; height: 64px; width: 64px; }
  .tile .name { font-weight: 700; font-size: 12px; line-height: 1.2; text-align: center; }

  /* Pasek kategorii */
  .bar {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: minmax(64px, 1fr);
    overflow-x: auto;
    gap: 4px;
    border-top: 1px solid var(--tile-line);
    padding-top: 8px;
  }
  .cat {
    font: inherit; color: var(--ink);
    background: transparent; border: 0; border-radius: 6px;
    padding: 6px 2px; min-height: 48px; cursor: pointer;
    display: grid; justify-items: center; gap: 2px;
  }
  .cat[aria-pressed="true"] { background: var(--selected); color: var(--on-selected); }
  .cat svg { width: 24px; height: 24px; display: block; }
  .cat .label { display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; white-space: nowrap; }
  .cat .label .patch { width: 7px; height: 7px; }
  .cat .value { font-size: 11px; line-height: 1.1; opacity: 0.8; white-space: nowrap; }

  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  /* Kreska: jedna grubość wszędzie */
  .ink * { vector-effect: non-scaling-stroke; stroke: currentColor; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; fill: none; }
  .ink .fig path, .ink .fig circle, .ink .fig ellipse { fill: var(--fig-body); stroke: var(--fig-line); }
  .ink .glow path, .ink .glow circle, .ink .glow ellipse { fill: var(--glow); stroke: var(--glow); stroke-width: 7; }
  .ink .thin { stroke-width: 1; opacity: 0.5; }
  .ink .dash { stroke-dasharray: 4 4; }
</style>

<div class="app">
  <div class="top">
    <h1>Dairecto</h1>
    <div class="modes" role="group" aria-label="Tryb">
      <button class="chip" type="button" id="mode-photo" data-mode="photo"><span class="patch" style="background:#D67E2C"></span>Zdjęcie</button>
      <button class="chip" type="button" id="mode-video" data-mode="video"><span class="patch" style="background:#AF363C"></span>Wideo</button>
    </div>
    <button class="chip" type="button" id="copy">Kopiuj</button>
  </div>

  <div class="stage">
    <svg id="preview" class="ink" role="img" aria-label="Podgląd kadru" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="readout" id="readout"></div>
  </div>

  <div class="panel" id="panel" role="group" aria-label="Opcje"></div>
  <nav class="bar" id="bar" aria-label="Kategorie"></nav>
</div>

<script>
  const NS = "http://www.w3.org/2000/svg";

  // ---------- Szablon: kategorie, opcje, frazy promptu ----------
  const CATEGORIES = [
    { id: "format", label: "Format", patch: "#E0A32E" },
    { id: "body", label: "Postać", patch: "#BB5695", options: [
      { id: "female", name: "Kobieta", short: "Kobieta", prompt: "of a single adult woman in plain, neutral-coloured casual clothing" },
      { id: "male", name: "Mężczyzna", short: "Mężczyz.", prompt: "of a single adult man in plain, neutral-coloured casual clothing" }
    ]},
    { id: "pose", label: "Poza", patch: "#C29682", options: [
      { id: "stand", name: "Stoi", short: "Stoi", prompt: "standing upright, weight evenly on both feet, arms relaxed at the sides, facing the camera" },
      { id: "sit", name: "Siedzi na ziemi", short: "Siedzi", prompt: "sitting on the ground with knees bent, forearms resting on the knees, back straight, facing the camera" }
    ]},
    { id: "shot", label: "Kadr", patch: "#735244", options: [
      { id: "full", name: "Cała sylwetka", short: "Całość", prompt: "Full-body shot, entire body visible from head to feet" },
      { id: "portrait", name: "Portret", short: "Portret", prompt: "Close-up portrait, head and shoulders in frame" }
    ]},
    { id: "camera", label: "Kamera", patch: "#627A9D", options: [
      { id: "low", name: "Z dołu", short: "Z dołu", prompt: "low-angle shot, camera near the ground looking up at the subject" },
      { id: "eye", name: "Na wysokości oczu", short: "Oczy", prompt: "eye-level shot, camera at the subject's eye height, straight-on" }
    ]},
    { id: "light", label: "Światło", patch: "#576C43", options: [
      { id: "soft", name: "Miękkie", short: "Miękkie", prompt: "soft diffused frontal light, gentle shadows" },
      { id: "rim", name: "Kontra z tyłu", short: "Kontra", prompt: "strong rim light from behind outlining the silhouette, face in soft shadow" }
    ]},
    { id: "background", label: "Tło", patch: "#8580B1", options: [
      { id: "studio", name: "Studio", short: "Studio", prompt: "plain light-grey seamless studio backdrop" },
      { id: "street", name: "Ulica", short: "Ulica", prompt: "empty city street in daylight, background softly out of focus" }
    ]},
    { id: "motion", label: "Ruch", patch: "#0885A1", modes: ["video"], options: [
      { id: "orbit", name: "Obrót wokół", short: "Obrót", prompt: "camera slowly orbits 360° around the subject, smooth steady motion" },
      { id: "dolly", name: "Najazd", short: "Najazd", prompt: "slow dolly-in towards the subject, smooth steady motion" }
    ]}
  ];

  const FORMATS = {
    photo: [
      { id: "4x5", w: 4, h: 5, name: "4:5 Pion", short: "4:5", prompt: "vertical 4:5 frame" },
      { id: "2x3", w: 2, h: 3, name: "2:3 Pion", short: "2:3", prompt: "vertical 2:3 frame" },
      { id: "1x1", w: 1, h: 1, name: "1:1 Kwadrat", short: "1:1", prompt: "square 1:1 frame" },
      { id: "3x2", w: 3, h: 2, name: "3:2 Poziom", short: "3:2", prompt: "horizontal 3:2 frame" }
    ],
    video: [
      { id: "9x16", w: 9, h: 16, name: "9:16 Pion", short: "9:16", prompt: "vertical 9:16 frame" },
      { id: "1x1", w: 1, h: 1, name: "1:1 Kwadrat", short: "1:1", prompt: "square 1:1 frame" },
      { id: "16x9", w: 16, h: 9, name: "16:9 Poziom", short: "16:9", prompt: "horizontal 16:9 frame" },
      { id: "21x9", w: 21, h: 9, name: "21:9 Kino", short: "21:9", prompt: "cinematic 21:9 widescreen frame" }
    ]
  };

  const ENDING = {
    photo: "50mm lens, photorealistic photograph, natural skin texture, high detail",
    video: "50mm lens, cinematic photorealistic video, natural skin texture, high detail"
  };
  const READOUT = { photo: "f/2.8 · 1/125 · ISO 100", video: "00:00:05:00 · 24 fps" };

  // ---------- Stan sceny ----------
  const scene = {
    mode: "photo",
    format: { photo: "4x5", video: "9x16" },
    body: "female", pose: "stand", shot: "full", camera: "eye", light: "soft", background: "studio", motion: "orbit",
    open: "format"
  };

  const activeCats = () => CATEGORIES.filter(c => !c.modes || c.modes.includes(scene.mode));
  const currentFormat = () => FORMATS[scene.mode].find(x => x.id === scene.format[scene.mode]);
  const optionsOf = catId => CATEGORIES.find(c => c.id === catId).options;
  const optionOf = (catId, id) => optionsOf(catId).find(o => o.id === id);

  function buildPrompt() {
    const parts = [
      optionOf("shot", scene.shot).prompt + " " + optionOf("body", scene.body).prompt,
      optionOf("pose", scene.pose).prompt,
      optionOf("camera", scene.camera).prompt,
      optionOf("light", scene.light).prompt,
      optionOf("background", scene.background).prompt
    ];
    if (scene.mode === "video") parts.push(optionOf("motion", scene.motion).prompt);
    parts.push(currentFormat().prompt, ENDING[scene.mode]);
    return parts.join(", ") + ".";
  }

  // ---------- Manekin ----------
  // Proporcje manekina. Strona bliższa widzowi jest szersza: widok 3/4.
  const BODIES = {
    male: {
      pelvisDown: 6, pelvisUp: 14, waistTop: 20, chest: 45, neck: 9, headRx: 11, headRy: 15,
      upperArm: 36, forearm: 32, thigh: 46, shin: 44, foot: 16,
      shoulderNear: 17, shoulderFar: 12, hipNear: 9, hipFar: 7,
      chestTop: [19, 14], chestBottom: [11, 9], pelvisTop: [11, 9], pelvisBottom: [13, 10]
    },
    female: {
      pelvisDown: 6, pelvisUp: 14, waistTop: 19, chest: 41, neck: 9, headRx: 10, headRy: 14,
      upperArm: 33, forearm: 30, thigh: 44, shin: 42, foot: 14,
      shoulderNear: 14, shoulderFar: 10, hipNear: 10, hipFar: 8,
      chestTop: [16, 12], chestBottom: [9, 7], pelvisTop: [11, 9], pelvisBottom: [15, 12]
    }
  };
  // Kąty bezwzględne: 0 = w dół, 90 = w prawo, 180 = w górę.
  const POSES = {
    stand: {
      spine: 180, head: 180,
      nearUpper: -7, nearFore: -2, farUpper: 7, farFore: 3,
      nearThigh: -3, nearShin: 1, farThigh: 3, farShin: 0,
      nearFoot: 62, farFoot: 62
    },
    sit: {
      spine: 172, head: 178,
      nearUpper: 50, nearFore: 95, farUpper: 45, farFore: 88,
      nearThigh: 135, nearShin: 42, farThigh: 138, farShin: 45,
      nearFoot: 72, farFoot: 72
    }
  };

  const rad = d => d * Math.PI / 180;
  const dir = a => [Math.sin(rad(a)), Math.cos(rad(a))];
  const add = (p, v, s = 1) => [p[0] + v[0] * s, p[1] + v[1] * s];
  const f = n => (+n).toFixed(2);

  function capsule(A, B, rA, rB) {
    const dx = B[0] - A[0], dy = B[1] - A[1], len = Math.hypot(dx, dy) || 1;
    const n = [-dy / len, dx / len];
    const p1 = add(A, n, rA), p2 = add(B, n, rB), p3 = add(B, n, -rB), p4 = add(A, n, -rA);
    return `M${f(p1[0])},${f(p1[1])} L${f(p2[0])},${f(p2[1])} A${rB},${rB} 0 0 0 ${f(p3[0])},${f(p3[1])} L${f(p4[0])},${f(p4[1])} A${rA},${rA} 0 0 0 ${f(p1[0])},${f(p1[1])} Z`;
  }
  const poly = pts => "M" + pts.map(p => f(p[0]) + "," + f(p[1])).join(" L") + " Z";

  const figCache = {};
  function buildFigure(poseId, bodyId = "male") {
    const key = poseId + "/" + bodyId;
    if (figCache[key]) return figCache[key];
    const pose = POSES[poseId], RIG = BODIES[bodyId];
    const P = [0, 0], u = dir(pose.spine), r = [-u[1], u[0]];
    const shapes = [], pts = [];
    const push = (s, ...ps) => { shapes.push(s); pts.push(...ps); };
    const Ct = add(P, u, RIG.waistTop + RIG.chest), Cb = add(P, u, RIG.waistTop);
    const shoulder = side => add(add(Ct, u, -6), r, side === "near" ? -RIG.shoulderNear : RIG.shoulderFar);
    const hip = side => add(P, r, side === "near" ? -RIG.hipNear : RIG.hipFar);

    function arm(side) {
      const S = shoulder(side);
      const E = add(S, dir(pose[side + "Upper"]), RIG.upperArm);
      const W = add(E, dir(pose[side + "Fore"]), RIG.forearm);
      const Hc = add(W, dir(pose[side + "Fore"]), 7);
      push({ t: "path", d: capsule(S, E, 5, 4) }, [S, 6], [E, 5]);
      push({ t: "path", d: capsule(E, W, 4, 3) }, [W, 4]);
      push({ t: "ellipse", cx: Hc[0], cy: Hc[1], rx: 4.5, ry: 8, rot: -pose[side + "Fore"] }, [Hc, 9]);
      push({ t: "circle", cx: E[0], cy: E[1], r: 3.5 });
      push({ t: "circle", cx: S[0], cy: S[1], r: 5.5 });
    }
    function leg(side) {
      const H = hip(side);
      const K = add(H, dir(pose[side + "Thigh"]), RIG.thigh);
      const A = add(K, dir(pose[side + "Shin"]), RIG.shin);
      const T = add(A, dir(pose[side + "Foot"]), RIG.foot);
      push({ t: "path", d: capsule(H, K, 7, 5) }, [H, 8], [K, 6]);
      push({ t: "path", d: capsule(K, A, 5, 3.5) }, [A, 5]);
      push({ t: "path", d: capsule(A, T, 4.5, 2.5) }, [T, 4]);
      push({ t: "circle", cx: A[0], cy: A[1], r: 3 });
      push({ t: "circle", cx: K[0], cy: K[1], r: 4.5 });
    }

    leg("far");
    arm("far");
    const pb = add(P, u, -RIG.pelvisDown), pt = add(P, u, RIG.pelvisUp);
    push({ t: "path", d: capsule(pt, Cb, 7, 8) });
    const [pbn, pbf] = RIG.pelvisBottom, [ptn, ptf] = RIG.pelvisTop, [ctn, ctf] = RIG.chestTop, [cbn, cbf] = RIG.chestBottom;
    push({ t: "path", d: poly([add(pb, r, -pbn), add(pb, r, pbf), add(pt, r, ptf), add(pt, r, -ptn)]) }, [add(pb, r, -pbn), 1], [add(pb, r, pbf), 1]);
    push({ t: "path", d: poly([add(Ct, r, -ctn), add(Ct, r, ctf), add(Cb, r, cbf), add(Cb, r, -cbn)]) }, [add(Ct, r, -ctn), 1], [add(Ct, r, ctf), 1]);
    const hd = dir(pose.head);
    const N1 = add(Ct, hd, RIG.neck);
    const Hc = add(N1, hd, RIG.headRy - 1);
    push({ t: "path", d: capsule(Ct, N1, 3.5, 3.5) });
    push({ t: "ellipse", cx: Hc[0], cy: Hc[1], rx: RIG.headRx, ry: RIG.headRy, rot: 180 - pose.head }, [Hc, RIG.headRy + 1]);
    leg("near");
    arm("near");

    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    pts.forEach(([p, rr]) => {
      minX = Math.min(minX, p[0] - rr); maxX = Math.max(maxX, p[0] + rr);
      minY = Math.min(minY, p[1] - rr); maxY = Math.max(maxY, p[1] + rr);
    });
    return (figCache[key] = { shapes, head: Hc, box: { minX, minY, maxX, maxY, w: maxX - minX, h: maxY - minY } });
  }
  // Wzorzec skali: stojący mężczyzna. Każda poza ma ten sam rozmiar ciała, kobieta jest nieco niższa.
  const REF = buildFigure("stand", "male").box;

  function el(tag, attrs = {}, parent) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }

  function drawShapes(g, shapes) {
    shapes.forEach(s => {
      if (s.t === "path") el("path", { d: s.d }, g);
      else if (s.t === "circle") el("circle", { cx: f(s.cx), cy: f(s.cy), r: s.r }, g);
      else el("ellipse", { cx: f(s.cx), cy: f(s.cy), rx: s.rx, ry: s.ry, transform: `rotate(${f(s.rot)} ${f(s.cx)} ${f(s.cy)})` }, g);
    });
  }

  // Umieszcza manekina w kadrze W×H. Skala zależy tylko od kadru i postaci stojącej.
  function place(poseId, bodyId, shot, W, H) {
    const fig = buildFigure(poseId, bodyId), b = fig.box;
    let scale, x, y, groundY;
    if (shot === "portrait") {
      scale = (H * 0.78) / (REF.h * 0.42);
      y = H * 0.1;
      x = W / 2 - (fig.head[0] - b.minX) * scale;
      groundY = y + b.h * scale;
    } else {
      groundY = H * 0.86;
      scale = (groundY - H * 0.14) / REF.h;
      x = W / 2 - (b.w * scale) / 2;
      y = groundY - b.h * scale;
    }
    const toScene = p => [x + (p[0] - b.minX) * scale, y + (p[1] - b.minY) * scale];
    return { fig, scale, x, y, w: b.w * scale, h: b.h * scale, groundY, head: toScene(fig.head) };
  }

  function drawFigureAt(parent, pl, cls) {
    const b = pl.fig.box;
    const holder = el("svg", {
      viewBox: `${f(b.minX)} ${f(b.minY)} ${f(b.w)} ${f(b.h)}`,
      x: f(pl.x), y: f(pl.y), width: f(pl.w), height: f(pl.h), overflow: "visible"
    }, parent);
    drawShapes(el("g", { class: cls }, holder), pl.fig.shapes);
  }

  function arrow(parent, x1, y1, x2, y2, size, cls = "") {
    el("line", { x1: f(x1), y1: f(y1), x2: f(x2), y2: f(y2), class: cls }, parent);
    const a = Math.atan2(y2 - y1, x2 - x1);
    const p = t => [x2 - size * Math.cos(a + t), y2 - size * Math.sin(a + t)];
    const l = p(0.45), r = p(-0.45);
    el("path", { d: `M${f(l[0])},${f(l[1])} L${f(x2)},${f(y2)} L${f(r[0])},${f(r[1])}` }, parent);
  }

  function cameraGlyph(parent, cx, cy, s) {
    el("rect", { x: f(cx - s * 0.7), y: f(cy - s * 0.45), width: f(s * 1.1), height: f(s * 0.9), rx: f(s * 0.12) }, parent);
    el("path", { d: `M${f(cx + s * 0.4)},${f(cy - s * 0.25)} L${f(cx + s * 0.8)},${f(cy - s * 0.45)} L${f(cx + s * 0.8)},${f(cy + s * 0.45)} L${f(cx + s * 0.4)},${f(cy + s * 0.25)} Z` }, parent);
  }

  let clipSeq = 0;
  // Składa szkic sceny. layers: które warstwy narysować (kafelek pokazuje tylko swoją).
  function renderScene(svg, st, W, H, layers, opts = {}) {
    svg.replaceChildren();
    svg.setAttribute("viewBox", `0 0 ${f(W)} ${f(H)}`);
    const id = "clip" + (++clipSeq);
    el("rect", { x: 0, y: 0, width: f(W), height: f(H) }, el("clipPath", { id }, el("defs", {}, svg)));
    const g = el("g", { "clip-path": `url(#${id})` }, svg);

    const pl = place(st.pose, st.body, st.shot, W, H);
    const cx = pl.x + pl.w / 2;
    const horizonY = st.camera === "eye" ? pl.head[1] : Math.min(pl.groundY - pl.h * 0.04, H * 0.93);
    const u = H / 100;

    // Tło
    if (layers.has("background")) {
      if (st.background === "studio") {
        const gy = Math.min(pl.groundY, H * 0.9);
        el("rect", { x: f(W * 0.08), y: f(H * 0.03), width: f(W * 0.84), height: f(u * 3), rx: f(u * 1.5), class: "thin" }, g);
        el("path", { d: `M${f(W * 0.11)},${f(H * 0.06)} L${f(W * 0.11)},${f(gy)} L${f(W * 0.01)},${f(H)}`, class: "thin" }, g);
        el("path", { d: `M${f(W * 0.89)},${f(H * 0.06)} L${f(W * 0.89)},${f(gy)} L${f(W * 0.99)},${f(H)}`, class: "thin" }, g);
      } else {
        const vp = [W / 2, Math.max(H * 0.3, Math.min(horizonY, H * 0.9))];
        const toward = (A, xs) => { const t = (xs - A[0]) / (vp[0] - A[0]); return [xs, A[1] + (vp[1] - A[1]) * t]; };
        el("path", { d: `M${f(W * 0.04)},${f(H)} L${f(vp[0])},${f(vp[1])} L${f(W * 0.96)},${f(H)}`, class: "thin" }, g);
        [[0, W * 0.3], [W, W * 0.7]].forEach(([edge, xs]) => {
          const top = toward([edge, H * 0.02], xs), bot = toward([edge, H * 0.96], xs);
          el("path", { d: `M${f(edge)},${f(H * 0.02)} L${f(top[0])},${f(top[1])} L${f(bot[0])},${f(bot[1])} L${f(edge)},${f(H * 0.96)}`, class: "thin" }, g);
          const mid = toward([edge, H * 0.4], xs);
          el("line", { x1: f(edge), y1: f(H * 0.4), x2: f(mid[0]), y2: f(mid[1]), class: "thin" }, g);
        });
      }
    }

    // Podłoże
    if (st.shot === "full" && layers.has("ground")) {
      el("line", { x1: 0, y1: f(pl.groundY), x2: f(W), y2: f(pl.groundY), class: "thin" }, g);
    }

    // Kamera: linia horyzontu i znak aparatu
    if (layers.has("camera")) {
      const s = u * 7;
      cameraGlyph(g, W * 0.06 + s * 0.7, horizonY, s);
      el("line", { x1: f(W * 0.06 + s * 1.7), y1: f(horizonY), x2: f(W), y2: f(horizonY), class: "dash" }, g);
    }

    // Kontra: źródło za postacią i poświata wokół konturu
    if (layers.has("light") && st.light === "rim") {
      const sx = cx + pl.w * 0.28, sy = pl.y + pl.h * 0.08, rr = u * 3.5;
      el("circle", { cx: f(sx), cy: f(sy), r: f(rr) }, g);
      for (let k = 0; k < 8; k++) {
        const a = k * Math.PI / 4;
        el("line", { x1: f(sx + Math.cos(a) * rr * 1.5), y1: f(sy + Math.sin(a) * rr * 1.5), x2: f(sx + Math.cos(a) * rr * 2.3), y2: f(sy + Math.sin(a) * rr * 2.3) }, g);
      }
      drawFigureAt(g, pl, "glow");
    }

    // Ruch: tylna połowa orbity za postacią
    const orbit = { cx, cy: pl.y + pl.h * 0.62, rx: Math.max(pl.w * 0.75, W * 0.3), ry: u * 6 };
    if (layers.has("motion") && st.motion === "orbit") {
      el("path", { d: `M${f(orbit.cx - orbit.rx)},${f(orbit.cy)} A${f(orbit.rx)},${f(orbit.ry)} 0 0 1 ${f(orbit.cx + orbit.rx)},${f(orbit.cy)}`, class: "dash" }, g);
    }

    drawFigureAt(g, pl, "fig");

    // Ruch: przednia połowa orbity albo najazd kamery
    if (layers.has("motion")) {
      if (st.motion === "orbit") {
        el("path", { d: `M${f(orbit.cx + orbit.rx)},${f(orbit.cy)} A${f(orbit.rx)},${f(orbit.ry)} 0 0 1 ${f(orbit.cx - orbit.rx)},${f(orbit.cy)}`, class: "dash" }, g);
        const ax = orbit.cx + orbit.rx * 0.5, ay = orbit.cy + orbit.ry * Math.sqrt(0.75);
        arrow(g, ax + u * 4, ay - u * 0.6, ax, ay, u * 3);
      } else {
        const s = u * 7, camX = W * 0.14, camY = H * 0.82;
        cameraGlyph(g, camX, camY, s);
        arrow(g, camX + s, camY - s * 0.6, cx - pl.w * 0.15, pl.y + pl.h * 0.45, u * 3.5, "dash");
      }
    }

    // Miękkie światło: panel z przodu i promienie w stronę postaci
    if (layers.has("light") && st.light === "soft") {
      const bw = Math.max(W * 0.14, u * 12), bh = u * 7, bx = W * 0.94 - bw, by = H * 0.08;
      el("rect", { x: f(bx), y: f(by), width: f(bw), height: f(bh), rx: f(u) }, g);
      const tx = cx + pl.w * 0.1, ty = pl.y + pl.h * 0.35;
      [-1, 0, 1].forEach(k => {
        const sx = bx + bw * 0.5 + k * bw * 0.3, sy = by + bh + u * 2;
        arrow(g, sx, sy, sx + (tx - sx) * 0.55, sy + (ty - sy) * 0.55, u * 2.5);
      });
    }

    // Rama kadru
    el("rect", { x: 0.5, y: 0.5, width: f(W - 1), height: f(H - 1) }, svg);
    if (opts.corners) {
      const c = u * 5, i = u * 3;
      [[i, i, 1, 1], [W - i, i, -1, 1], [i, H - i, 1, -1], [W - i, H - i, -1, -1]].forEach(([x, y, sx, sy]) => {
        el("path", { d: `M${f(x)},${f(y + sy * c)} L${f(x)},${f(y)} L${f(x + sx * c)},${f(y)}` }, svg);
      });
    }
  }

  // ---------- Ikony paska kategorii ----------
  const CAT_ICONS = {
    format: svg => el("rect", { x: 6, y: 3, width: 12, height: 18, rx: 1.5 }, svg),
    shot: svg => el("path", { d: "M4 9V4h5 M15 4h5v5 M20 15v5h-5 M9 20H4v-5" }, svg),
    camera: svg => { el("rect", { x: 3, y: 7, width: 13, height: 11, rx: 1.5 }, svg); el("path", { d: "M16 10l5-3v11l-5-3z" }, svg); },
    light: svg => { el("circle", { cx: 12, cy: 12, r: 4 }, svg); el("path", { d: "M12 2v3 M12 19v3 M2 12h3 M19 12h3 M4.9 4.9l2.1 2.1 M17 17l2.1 2.1 M4.9 19.1l2.1-2.1 M17 7l2.1-2.1" }, svg); },
    background: svg => { el("rect", { x: 3, y: 3, width: 18, height: 3, rx: 1.5 }, svg); el("path", { d: "M5 6v11l-2 4 M19 6v11l2 4 M5 17h14" }, svg); },
    motion: svg => { el("ellipse", { cx: 12, cy: 15, rx: 9, ry: 3.5 }, svg); el("circle", { cx: 12, cy: 5, r: 2 }, svg); el("path", { d: "M12 7v8 M15 19.4l2.4-0.8-1.4-2" }, svg); },
    body: svg => miniFigure(svg, "stand", scene.body),
    pose: svg => miniFigure(svg, "sit", scene.body)
  };

  // Mały ludzik w ikonie 24×24, dopasowany do pola
  function miniFigure(svg, poseId, bodyId) {
    const fig = buildFigure(poseId, bodyId), b = fig.box, s = 22 / Math.max(b.w, b.h);
    const holder = el("svg", { viewBox: `${f(b.minX)} ${f(b.minY)} ${f(b.w)} ${f(b.h)}`, x: f(12 - b.w * s / 2), y: f(23 - b.h * s), width: f(b.w * s), height: f(b.h * s) }, svg);
    drawShapes(el("g", { class: "fig" }, holder), fig.shapes);
  }

  // ---------- Interfejs ----------
  const bar = document.getElementById("bar");
  const panel = document.getElementById("panel");
  const preview = document.getElementById("preview");

  function valueShort(cat) {
    if (cat.id === "format") return currentFormat().short;
    return optionOf(cat.id, scene[cat.id]).short;
  }

  function renderBar() {
    const cats = activeCats();
    bar.replaceChildren();
    cats.forEach(cat => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "cat";
      b.id = "cat-" + cat.id;
      b.setAttribute("aria-pressed", String(scene.open === cat.id));
      const svg = el("svg", { viewBox: "0 0 24 24", class: "ink", "aria-hidden": "true" });
      CAT_ICONS[cat.id](svg);
      const label = document.createElement("span");
      label.className = "label";
      const patch = document.createElement("span");
      patch.className = "patch";
      patch.style.background = cat.patch;
      label.append(patch, cat.label);
      const value = document.createElement("span");
      value.className = "value";
      value.textContent = valueShort(cat);
      b.append(svg, label, value);
      b.addEventListener("click", () => { scene.open = scene.open === cat.id ? null : cat.id; render(); });
      bar.appendChild(b);
    });
  }

  function tile(id, name, pressed, onClick, draw) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "tile";
    b.id = id;
    b.setAttribute("aria-pressed", String(pressed));
    const svg = el("svg", { class: "ink", "aria-hidden": "true" });
    draw(svg);
    const n = document.createElement("span");
    n.className = "name";
    n.textContent = name;
    b.append(svg, n);
    b.addEventListener("click", onClick);
    panel.appendChild(b);
  }

  // Warstwy pokazywane na miniaturach danej kategorii
  const TILE_LAYERS = {
    shot: ["ground"],
    camera: ["ground", "camera"],
    light: ["ground", "light"],
    background: ["ground", "background"],
    motion: ["ground", "motion"]
  };

  function renderPanel() {
    panel.replaceChildren();
    panel.hidden = !scene.open;
    if (!scene.open) return;
    const catId = scene.open;

    if (catId === "format") {
      FORMATS[scene.mode].forEach(fmt => tile("opt-format-" + fmt.id, fmt.name, scene.format[scene.mode] === fmt.id,
        () => { scene.format[scene.mode] = fmt.id; render(); },
        svg => {
          const s = 56 / Math.max(fmt.w, fmt.h), w = fmt.w * s, h = fmt.h * s;
          svg.setAttribute("viewBox", "0 0 64 64");
          el("rect", { x: f(32 - w / 2), y: f(32 - h / 2), width: f(w), height: f(h), rx: 2 }, svg);
        }));
      return;
    }

    if (catId === "pose" || catId === "body") {
      const boxes = [];
      Object.keys(POSES).forEach(pk => Object.keys(BODIES).forEach(bk => boxes.push(buildFigure(pk, bk).box)));
      const side = Math.max(...boxes.map(b => b.w), ...boxes.map(b => b.h)) + 12;
      optionsOf(catId).forEach(o => tile("opt-" + catId + "-" + o.id, o.name, scene[catId] === o.id,
        () => { scene[catId] = o.id; render(); },
        svg => {
          const fig = catId === "pose" ? buildFigure(o.id, scene.body) : buildFigure(scene.pose, o.id), b = fig.box;
          const x = b.minX - (side - b.w) / 2, y = b.maxY + 6 - side;
          svg.setAttribute("viewBox", `${f(x)} ${f(y)} ${f(side)} ${f(side)}`);
          el("line", { x1: f(x), y1: f(b.maxY), x2: f(x + side), y2: f(b.maxY), class: "thin" }, svg);
          drawShapes(el("g", { class: "fig" }, svg), fig.shapes);
        }));
      return;
    }

    // Pozostałe kategorie: miniatura sceny z nałożoną tylko tą jedną opcją.
    optionsOf(catId).forEach(o => tile("opt-" + catId + "-" + o.id, o.name, scene[catId] === o.id,
      () => { scene[catId] = o.id; render(); },
      svg => renderScene(svg, { ...scene, [catId]: o.id }, 100, 100, new Set(TILE_LAYERS[catId]))));
  }

  function renderPreview() {
    const fmt = currentFormat();
    const H = 300, W = H * fmt.w / fmt.h;
    const layers = ["ground", "camera", "light", "background"];
    if (scene.mode === "video") layers.push("motion");
    renderScene(preview, scene, W, H, new Set(layers), { corners: true });
    const ro = document.getElementById("readout");
    ro.replaceChildren();
    if (scene.mode === "video") { const d = document.createElement("span"); d.className = "rec"; ro.appendChild(d); }
    ro.append(READOUT[scene.mode] + " · " + fmt.short);
  }

  function render() {
    document.body.dataset.mode = scene.mode;
    document.querySelectorAll(".modes .chip").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === scene.mode)));
    if (scene.open && !activeCats().some(c => c.id === scene.open)) scene.open = "format";
    renderBar();
    renderPanel();
    renderPreview();
  }

  document.querySelectorAll(".modes .chip").forEach(b => b.addEventListener("click", () => { scene.mode = b.dataset.mode; render(); }));

  // Kopiowanie bez pokazywania tekstu promptu
  const copyBtn = document.getElementById("copy");
  let copyTimer;
  function copyStatus(text) {
    copyBtn.textContent = text;
    clearTimeout(copyTimer);
    copyTimer = setTimeout(() => { copyBtn.textContent = "Kopiuj"; }, 2000);
  }
  function hiddenCopy(text) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;left:-9999px;top:0;opacity:0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    ta.remove();
    copyStatus(ok ? "Skopiowano" : "Nie udało się");
  }
  copyBtn.addEventListener("click", () => {
    const text = buildPrompt();
    try {
      navigator.clipboard.writeText(text).then(() => copyStatus("Skopiowano")).catch(() => hiddenCopy(text));
    } catch (e) {
      hiddenCopy(text);
    }
  });

  render();
</script>
