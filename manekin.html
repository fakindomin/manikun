<title>Dairecto Manekin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root {
    color-scheme: light;
    --bg: #D6D6D6;
    --tile: #EDEDED;
    --tile-line: #B5B5B5;
    --ink: #1E1E1E;
    --muted: #4A4A4A;
    --selected: #1E1E1E;
    --on-selected: #F2F2F2;
    --fig-body: #F7F7F5;
    --fig-line: #1E1E1E;
    --font: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.5;
    padding: 0 16px;
  }
  main {
    max-width: 1040px;
    margin: 0 auto;
    padding-block: 24px 56px;
    display: grid;
    gap: 24px;
  }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
  .readout { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* Podgląd: sam kontur, przyklejony u góry na telefonie */
  .preview-wrap {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 1;
    background: var(--bg);
    padding-block: 8px;
    display: flex;
    justify-content: center;
    color: var(--ink);
  }
  #preview { display: block; height: 30vh; max-height: 260px; max-width: 100%; }

  .questions { display: grid; gap: 20px; align-content: start; }
  .q { display: grid; gap: 8px; }
  .q-label {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.08em;
  }
  .patch { width: 12px; height: 12px; border-radius: 2px; flex: none; }
  .options { display: grid; grid-template-columns: repeat(var(--cols, 2), 1fr); gap: 8px; }

  .tile {
    font: inherit;
    color: var(--ink);
    background: var(--tile);
    border: 1px solid var(--tile-line);
    border-radius: 6px;
    padding: 12px 6px 10px;
    cursor: pointer;
    display: grid;
    justify-items: center;
    align-content: start;
    gap: 6px;
  }
  .tile[aria-pressed="true"] {
    background: var(--selected);
    border-color: var(--selected);
    color: var(--on-selected);
  }
  .tile svg { display: block; height: 72px; width: auto; max-width: 100%; }
  .tile .name { font-weight: 700; font-size: 14px; line-height: 1.2; }
  .tile .sub { font-size: 12px; line-height: 1.2; opacity: 0.75; }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  /* Jedna grubość kreski wszędzie, niezależnie od skali rysunku */
  .ink * { vector-effect: non-scaling-stroke; stroke: currentColor; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
  /* Manekin ma pełne, jasne wypełnienie i zawsze ciemny kontur, żeby nie mieszał się z elementami sceny */
  .ink .fig path, .ink .fig circle, .ink .fig ellipse { fill: var(--fig-body); stroke: var(--fig-line); }
  .ink .none { fill: none; }
  .ink .thin { stroke-width: 1; opacity: 0.55; }

  .note { font-size: 14px; color: var(--muted); max-width: 60ch; margin: 0; }

  @media (min-width: 820px) {
    main { grid-template-columns: 1.1fr 1fr; align-items: start; column-gap: 40px; }
    header { grid-column: 1 / -1; }
    .preview-wrap { top: 24px; padding-block: 0; }
    #preview { height: auto; width: 100%; max-height: 70vh; }
  }
</style>

<main>
  <header>
    <h1>Dairecto</h1>
    <span class="readout" id="readout"></span>
  </header>

  <div class="preview-wrap">
    <svg id="preview" class="ink" role="img" aria-label="Podgląd kadru"></svg>
  </div>

  <div class="questions">
    <div class="q">
      <div class="q-label" id="q-format"><span class="patch" style="background:#E0A32E"></span>Format</div>
      <div class="options" id="opts-format" role="group" aria-labelledby="q-format" style="--cols:4"></div>
    </div>
    <div class="q">
      <div class="q-label" id="q-pose"><span class="patch" style="background:#C29682"></span>Poza</div>
      <div class="options" id="opts-pose" role="group" aria-labelledby="q-pose"></div>
    </div>
    <p class="note">Szkic do akceptacji: jeden manekin w SVG rysowany z kątów stawów. Ten sam rysunek trafia na kafelki i do podglądu.</p>
  </div>
</main>

<script>
  const NS = "http://www.w3.org/2000/svg";

  // Wymiary manekina (jednostki rysunku). Strona bliższa widzowi jest szersza: widok 3/4.
  const RIG = {
    pelvisDown: 6, pelvisUp: 14, waistTop: 20, chest: 45, neck: 9, headRx: 11, headRy: 15,
    upperArm: 36, forearm: 32, thigh: 46, shin: 44, foot: 16,
    shoulderNear: 17, shoulderFar: 12, hipNear: 9, hipFar: 7
  };

  // Pozy: kąty bezwzględne w stopniach. 0 = w dół, 90 = w prawo, 180 = w górę.
  const POSES = {
    stand: {
      spine: 180, head: 180,
      nearUpper: -7, nearFore: -2, farUpper: 7, farFore: 3,
      nearThigh: -3, nearShin: 1, farThigh: 3, farShin: 0,
      nearFoot: 62, farFoot: 62
    },
    sit: {
      spine: 172, head: 178,
      nearUpper: 50, nearFore: 95, farUpper: 45, farFore: 88,
      nearThigh: 135, nearShin: 42, farThigh: 138, farShin: 45,
      nearFoot: 72, farFoot: 72
    }
  };

  const FORMATS = [
    { id: "4x5", w: 4, h: 5, name: "4:5", sub: "Pion" },
    { id: "2x3", w: 2, h: 3, name: "2:3", sub: "Pion" },
    { id: "1x1", w: 1, h: 1, name: "1:1", sub: "Kwadrat" },
    { id: "3x2", w: 3, h: 2, name: "3:2", sub: "Poziom" }
  ];

  const POSE_TILES = [
    { id: "stand", name: "Stoi" },
    { id: "sit", name: "Siedzi na ziemi" }
  ];

  const scene = { format: "4x5", pose: "stand" };

  // --- geometria ---
  const rad = d => d * Math.PI / 180;
  const dir = a => [Math.sin(rad(a)), Math.cos(rad(a))];
  const add = (p, v, s = 1) => [p[0] + v[0] * s, p[1] + v[1] * s];
  const f = n => n.toFixed(2);

  // Człon o zwężającym się przekroju z zaokrąglonymi końcami.
  function capsule(A, B, rA, rB) {
    const dx = B[0] - A[0], dy = B[1] - A[1], len = Math.hypot(dx, dy) || 1;
    const n = [-dy / len, dx / len];
    const p1 = add(A, n, rA), p2 = add(B, n, rB), p3 = add(B, n, -rB), p4 = add(A, n, -rA);
    return `M${f(p1[0])},${f(p1[1])} L${f(p2[0])},${f(p2[1])} A${rB},${rB} 0 0 0 ${f(p3[0])},${f(p3[1])} L${f(p4[0])},${f(p4[1])} A${rA},${rA} 0 0 0 ${f(p1[0])},${f(p1[1])} Z`;
  }
  const poly = pts => "M" + pts.map(p => f(p[0]) + "," + f(p[1])).join(" L") + " Z";

  // Buduje listę kształtów manekina w kolejności rysowania (od najdalszych).
  function buildFigure(pose) {
    const P = [0, 0];
    const u = dir(pose.spine);
    const r = [-u[1], u[0]];
    const shapes = [];
    const pts = [];
    const push = (s, ...ps) => { shapes.push(s); pts.push(...ps); };

    const Ct = add(P, u, RIG.waistTop + RIG.chest);
    const Cb = add(P, u, RIG.waistTop);
    const shoulder = side => add(add(Ct, u, -6), r, side === "near" ? -RIG.shoulderNear : RIG.shoulderFar);
    const hip = side => add(P, r, side === "near" ? -RIG.hipNear : RIG.hipFar);

    function arm(side) {
      const S = shoulder(side);
      const E = add(S, dir(pose[side + "Upper"]), RIG.upperArm);
      const W = add(E, dir(pose[side + "Fore"]), RIG.forearm);
      const Hc = add(W, dir(pose[side + "Fore"]), 7);
      const ang = -pose[side + "Fore"];
      push({ t: "path", d: capsule(S, E, 5, 4) }, [S, 6], [E, 5]);
      push({ t: "path", d: capsule(E, W, 4, 3) }, [W, 4]);
      push({ t: "ellipse", cx: Hc[0], cy: Hc[1], rx: 4.5, ry: 8, rot: ang }, [Hc, 9]);
      push({ t: "circle", cx: E[0], cy: E[1], r: 3.5 });
      push({ t: "circle", cx: S[0], cy: S[1], r: 5.5 });
    }
    function leg(side) {
      const H = hip(side);
      const K = add(H, dir(pose[side + "Thigh"]), RIG.thigh);
      const A = add(K, dir(pose[side + "Shin"]), RIG.shin);
      const T = add(A, dir(pose[side + "Foot"]), RIG.foot);
      push({ t: "path", d: capsule(H, K, 7, 5) }, [H, 8], [K, 6]);
      push({ t: "path", d: capsule(K, A, 5, 3.5) }, [A, 5]);
      push({ t: "path", d: capsule(A, T, 4.5, 2.5) }, [T, 4]);
      push({ t: "circle", cx: A[0], cy: A[1], r: 3 });
      push({ t: "circle", cx: K[0], cy: K[1], r: 4.5 });
    }

    leg("far");
    arm("far");

    // Talia, miednica, klatka
    const pb = add(P, u, -RIG.pelvisDown), pt = add(P, u, RIG.pelvisUp);
    push({ t: "path", d: capsule(pt, Cb, 7, 8) });
    push({ t: "path", d: poly([add(pb, r, -13), add(pb, r, 10), add(pt, r, 9), add(pt, r, -11)]) },
      [add(pb, r, -13), 1], [add(pb, r, 10), 1]);
    push({ t: "path", d: poly([add(Ct, r, -19), add(Ct, r, 14), add(Cb, r, 9), add(Cb, r, -11)]) },
      [add(Ct, r, -19), 1], [add(Ct, r, 14), 1]);

    // Szyja i głowa
    const hd = dir(pose.head);
    const N1 = add(Ct, hd, RIG.neck);
    const Hc = add(N1, hd, RIG.headRy - 1);
    push({ t: "path", d: capsule(Ct, N1, 3.5, 3.5) });
    push({ t: "ellipse", cx: Hc[0], cy: Hc[1], rx: RIG.headRx, ry: RIG.headRy, rot: 180 - pose.head }, [Hc, RIG.headRy + 1]);

    leg("near");
    arm("near");

    // Obrys całości: do dopasowania rysunku w ramce
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    pts.forEach(([p, rr]) => {
      minX = Math.min(minX, p[0] - rr); maxX = Math.max(maxX, p[0] + rr);
      minY = Math.min(minY, p[1] - rr); maxY = Math.max(maxY, p[1] + rr);
    });
    return { shapes, box: { minX, minY, maxX, maxY, w: maxX - minX, h: maxY - minY } };
  }

  function el(tag, attrs = {}, parent) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }

  // Rysuje manekina do podanego <svg> lub <g>. withGround dodaje krótką linię podłoża.
  function drawFigure(target, poseId, withGround) {
    const { shapes, box } = buildFigure(POSES[poseId]);
    const g = el("g", { class: "fig" }, target);
    shapes.forEach(s => {
      if (s.t === "path") el("path", { d: s.d }, g);
      else if (s.t === "circle") el("circle", { cx: f(s.cx), cy: f(s.cy), r: s.r }, g);
      else el("ellipse", { cx: f(s.cx), cy: f(s.cy), rx: s.rx, ry: s.ry, transform: `rotate(${f(s.rot)} ${f(s.cx)} ${f(s.cy)})` }, g);
    });
    if (withGround) el("line", { x1: f(box.minX - 8), y1: f(box.maxY), x2: f(box.maxX + 8), y2: f(box.maxY), class: "thin" }, target);
    return box;
  }

  // --- kafelki ---
  function makeTile(container, step, opt, iconFn) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "tile";
    btn.id = "opt-" + step + "-" + opt.id;
    btn.dataset.step = step;
    btn.dataset.value = opt.id;
    const svg = el("svg", { class: "ink", "aria-hidden": "true" });
    iconFn(svg, opt);
    btn.appendChild(svg);
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = opt.name;
    btn.appendChild(name);
    if (opt.sub) {
      const sub = document.createElement("span");
      sub.className = "sub";
      sub.textContent = opt.sub;
      btn.appendChild(sub);
    }
    btn.addEventListener("click", () => { scene[step] = opt.id; render(); });
    container.appendChild(btn);
  }

  FORMATS.forEach(fmt => makeTile(document.getElementById("opts-format"), "format", fmt, (svg, o) => {
    const s = 60 / Math.max(o.w, o.h), w = o.w * s, h = o.h * s;
    svg.setAttribute("viewBox", "0 0 64 64");
    el("rect", { x: f(32 - w / 2), y: f(32 - h / 2), width: f(w), height: f(h), rx: 2, class: "none" }, svg);
  }));

  POSE_TILES.forEach(p => makeTile(document.getElementById("opts-pose"), "pose", p, (svg, o) => {
    const g = el("g", {}, svg);
    const box = drawFigure(g, o.id, true);
    const pad = 6;
    svg.setAttribute("viewBox", `${f(box.minX - pad - 8)} ${f(box.minY - pad)} ${f(box.w + 2 * pad + 16)} ${f(box.h + 2 * pad)}`);
  }));

  // --- podgląd ---
  const preview = document.getElementById("preview");
  function renderPreview() {
    const fmt = FORMATS.find(x => x.id === scene.format);
    const H = 300, W = H * fmt.w / fmt.h;
    preview.replaceChildren();
    preview.setAttribute("viewBox", `0 0 ${f(W)} ${H}`);

    // Rama kadru i narożniki
    const m = 1;
    el("rect", { x: m, y: m, width: f(W - 2 * m), height: H - 2 * m, class: "none" }, preview);
    const c = 14, i = 8;
    [[i, i, 1, 1], [W - i, i, -1, 1], [i, H - i, 1, -1], [W - i, H - i, -1, -1]].forEach(([x, y, sx, sy]) => {
      el("path", { d: `M${f(x)},${f(y + sy * c)} L${f(x)},${f(y)} L${f(x + sx * c)},${f(y)}`, class: "none" }, preview);
    });

    // Linia podłoża na całą szerokość i manekin stojący na niej
    const groundY = H * 0.86;
    el("line", { x1: 0, y1: f(groundY), x2: f(W), y2: f(groundY), class: "thin" }, preview);

    const holder = el("svg", {}, preview);
    const g = el("g", {}, holder);
    const box = drawFigure(g, scene.pose, false);
    // Manekin mieści się w bezpiecznym obszarze kadru: ogranicza go wysokość albo szerokość.
    const maxH = groundY - H * 0.14, maxW = W * 0.72;
    const scale = Math.min(maxH / box.h, maxW / box.w);
    const figH = box.h * scale;
    const figW = box.w * scale;
    holder.setAttribute("viewBox", `${f(box.minX)} ${f(box.minY)} ${f(box.w)} ${f(box.h)}`);
    holder.setAttribute("x", f(W / 2 - figW / 2));
    holder.setAttribute("y", f(groundY - figH));
    holder.setAttribute("width", f(figW));
    holder.setAttribute("height", f(figH));
    holder.setAttribute("overflow", "visible");

    document.getElementById("readout").textContent = `f/2.8 · 1/125 · ISO 100 · ${fmt.name}`;
  }

  function render() {
    document.querySelectorAll(".tile").forEach(b => {
      b.setAttribute("aria-pressed", String(scene[b.dataset.step] === b.dataset.value));
    });
    renderPreview();
  }
  render();
</script>
