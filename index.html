<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
  /* Ciemne studio: czarne tło z plamą światła za kadrem, zaokrąglone karty, jeden akcent.
     Zdjęcie ma limonkowy akcent, wideo czerwony jak lampka nagrywania. */
  :root {
    color-scheme: dark;
    --bg: #09090B;
    --bg-glow: #1B1C22;
    --surface: #141418;
    --surface-2: #1C1C22;
    --line: rgba(255, 255, 255, 0.08);
    --line-strong: rgba(255, 255, 255, 0.16);
    --ink: #F4F4F5;
    --muted: #8D8D97;
    --accent: #BCCB7C;
    --accent-soft: rgba(188, 203, 124, 0.14);
    --on-accent: #0B0B0D;
    --stage: #131316;
    --tile-bg: #1F1F26;
    --lift: 0 7px 16px rgba(0, 0, 0, 0.55), 0 2px 4px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.07);
    --fig-body: #F7F7F5;
    --fig-line: #1E1E1E;
    --glow: #FFFFFF;
    --font: "Geist", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  body[data-mode="video"] {
    --bg-glow: #221718;
    --accent: #FF5A4F;
    --accent-soft: rgba(255, 90, 79, 0.16);
    --on-accent: #0B0B0D;
  }

  html, body { height: 100%; }
  /* Na telefonie wysokość bez paska przeglądarki, żeby dół z kafelkami był zawsze widoczny */
  @supports (height: 100dvh) { html, body { height: 100dvh; } }
  body {
    background: var(--bg) radial-gradient(120% 70% at 50% 28%, var(--bg-glow) 0%, var(--bg) 62%) no-repeat;
    color: var(--ink);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.4;
    padding: 0 16px;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  [hidden] { display: none !important; }
  .screen {
    box-sizing: border-box;
    height: 100%;
    max-width: 640px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-block: 12px;
  }
  /* Elementy reżysera ukryte na starcie, pojawiają się po wyborze trybu */
  .director-only { transition: opacity 420ms ease; }
  [data-phase="start"] .director-only { opacity: 0; pointer-events: none; }
  [data-phase="director"] .combos { opacity: 0; pointer-events: none; }

  /* ---------- Pasek górny: pigułki ---------- */
  .top { display: flex; align-items: center; gap: 8px; position: relative; }
  .modes {
    display: flex; gap: 2px; margin-right: auto;
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px;
  }
  .chip {
    font: inherit; font-size: 13px; font-weight: 600;
    color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: 999px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    padding: 8px 14px; cursor: pointer;
    display: flex; align-items: center; gap: 7px;
    transition: background-color 300ms ease, color 300ms ease, border-color 300ms ease;
  }
  .modes .chip { background: transparent; border-color: transparent; box-shadow: none; padding: 7px 12px; color: var(--muted); }
  .modes .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .patch { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .chip.mat { padding: 4px 12px 4px 4px; }
  /* W reżyserze przełącznik materiału to sama próbka, żeby pasek się mieścił */
  [data-phase="director"] .chip.mat { padding: 4px; }
  [data-phase="director"] #material-name { display: none; }
  .swatch { width: 24px; height: 24px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.35); flex: none; }
  #copy {
    white-space: nowrap; background: var(--accent); border-color: var(--accent); color: var(--on-accent);
    font-weight: 700; box-shadow: 0 6px 22px var(--accent-soft);
  }

  /* ---------- Podgląd: karta sceny ---------- */
  .stage {
    flex: 1; min-height: 0;
    display: flex; flex-direction: column; gap: 6px;
    background: var(--stage);
    border: 1px solid var(--line);
    border-radius: 26px;
    padding: 14px 14px 10px;
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.04);
    color: rgba(244, 244, 245, 0.78);
    --halo: rgba(14, 14, 17, 0.62);
  }
  #preview { flex: 1; min-height: 0; width: 100%; display: block; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  [data-phase="start"] #preview { cursor: pointer; }
  .readout {
    font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums; text-align: center;
    display: flex; justify-content: center; align-items: center; gap: 6px;
  }
  .rec { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }

  /* ---------- Dół ekranu: stała wysokość, kadr nad nim się nie rusza ---------- */
  .dock { flex: none; position: relative; display: flex; flex-direction: column; gap: 10px; }
  .options { position: relative; height: 128px; overflow: hidden; margin-bottom: -8px; }
  .panel {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 128px;
    display: flex; gap: 10px; align-items: flex-end;
    overflow-x: auto; overflow-y: hidden;
    scrollbar-width: none;
    padding: 0 2px 16px;
    box-sizing: border-box;
  }
  .panel::-webkit-scrollbar { display: none; }

  /* Kafelki opcji: zawsze ten sam rozmiar */
  .tile {
    flex: none; box-sizing: border-box;
    width: 98px; height: 108px;
    font: inherit; color: rgba(244, 244, 245, 0.82);
    background: var(--tile-bg);
    border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 18px;
    box-shadow: var(--lift);
    padding: 8px 6px; cursor: pointer;
    display: grid; grid-template-rows: 60px auto; justify-items: center; align-content: start; gap: 4px;
    position: relative;
    --halo: var(--tile-bg);
    transition: transform 420ms var(--ease), border-color 300ms ease, box-shadow 300ms ease, color 300ms ease;
  }
  .tile.below { transform: translateY(calc(100% + 14px)); }
  .tile.out { transform: translateY(calc(100% + 14px)); transition: transform 280ms cubic-bezier(0.4, 0, 1, 1); pointer-events: none; }
  .tile[aria-pressed="true"] {
    color: var(--ink);
    border-color: var(--accent);
    box-shadow: inset 0 0 0 1px var(--accent), 0 8px 22px var(--accent-soft), var(--lift);
  }
  .tile > svg { display: block; height: 60px; width: 60px; border-radius: 10px; }
  .tile .name {
    font-weight: 600; font-size: 12px; line-height: 1.2; text-align: center;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  /* Kafelek z wariantami: karta pod spodem i znacznik rozwinięcia */
  .tile.group { margin-right: 5px; box-shadow: 5px -5px 0 -1px #19191F, 5px -5px 0 0 var(--line-strong), var(--lift); }
  .tile.group[aria-pressed="true"] { box-shadow: inset 0 0 0 1px var(--accent), 5px -5px 0 -1px #19191F, 5px -5px 0 0 var(--accent), 0 8px 22px var(--accent-soft), var(--lift); }
  .tile .badge {
    position: absolute; top: 8px; right: 9px; width: 6px; height: 6px;
    border-top: 1.5px solid currentColor; border-right: 1.5px solid currentColor;
    transform: rotate(45deg); opacity: 0.7;
  }
  /* Strzałka powrotu przypięta do lewej krawędzi: kafelki przewijają się pod nią */
  .tile.back {
    position: sticky; left: 0; z-index: 2;
    background: var(--bg); border-style: dashed; border-color: var(--line-strong);
    box-shadow: 10px 0 14px -4px var(--bg);
  }

  /* ---------- Pasek kategorii: pływający dok ---------- */
  [data-phase="start"] .cat { opacity: 0; transform: translateY(24px); }
  .bar { transition: opacity 420ms ease; }
  [data-phase="start"] .bar { opacity: 0; }
  .bar {
    flex: none;
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: minmax(66px, 1fr);
    overflow-x: auto;
    scrollbar-width: none;
    gap: 2px;
    background: rgba(20, 20, 24, 0.92);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 6px;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
  }
  .bar::-webkit-scrollbar { display: none; }
  .cat {
    font: inherit; color: var(--muted);
    background: transparent; border: 0; border-radius: 18px;
    padding: 7px 2px 6px; min-height: 48px; cursor: pointer;
    display: grid; justify-items: center; gap: 2px;
    transition: background-color 300ms ease, color 300ms ease, opacity 320ms ease, transform 420ms var(--ease);
  }
  [data-phase="director"] .cat:disabled { opacity: 0.35; cursor: default; }
  .cat.reset .label { color: var(--muted); }
  .cat.reset.armed { background: var(--accent-soft); color: var(--accent); }
  .cat.reset.armed .label { color: var(--accent); }
  .cat[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
  .cat > svg { width: 22px; height: 22px; display: block; }
  .cat .label { display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; white-space: nowrap; color: var(--ink); }
  .cat[aria-pressed="true"] .label { color: var(--accent); }
  .cat .label .patch { width: 6px; height: 6px; }
  .cat .value { font-size: 11px; line-height: 1.1; white-space: nowrap; }

  /* ---------- Start: powitanie i wybór trybu ---------- */
  .dock-start {
    position: absolute; inset: 0; z-index: 2;
    background: transparent;
    display: flex; flex-direction: column; justify-content: flex-end; gap: 14px;
  }
  .hello { text-align: center; display: grid; gap: 4px; transition: opacity 280ms ease, transform 420ms var(--ease); }
  /* Znaczek nad powitaniem: skala możliwości (ostrożnie liczone: kilkadziesiąt miliardów samych zdjęć postaci) */
  /* Na starcie w pustym miejscu górnego paska po lewej; w reżyserze znika, tam są przełączniki trybu */
  .combos {
    position: absolute; left: 0; top: 50%; transform: translateY(-50%); transition: opacity 420ms ease;
    max-width: calc(100% - 128px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-sizing: border-box;
    font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--accent); background: var(--accent-soft); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px;
  }
  .hello h1 { margin: 0; font-size: clamp(20px, 6.4vw, 26px); white-space: nowrap; font-weight: 700; letter-spacing: -0.03em; text-wrap: balance; }
  .hello h1 em { font-style: normal; color: var(--accent); }
  .hello p { margin: 0 auto; max-width: 34ch; font-size: 14px; line-height: 1.35; color: var(--muted); text-wrap: balance; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .choice {
    font: inherit; color: var(--ink);
    background: var(--tile-bg);
    border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 22px;
    box-shadow: var(--lift);
    padding: 16px 12px 14px; cursor: pointer;
    display: grid; justify-items: center; gap: 6px;
    transition: transform 360ms cubic-bezier(0.4, 0, 1, 1), border-color 300ms ease, box-shadow 300ms ease;
  }
  .choice[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent), 0 8px 22px var(--accent-soft), var(--lift); }
  .choice svg { width: 44px; height: 44px; display: block; color: var(--ink); }
  .choice .name { display: flex; align-items: center; gap: 7px; font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
  .choice .desc { font-size: 12px; line-height: 1.3; color: var(--muted); text-align: center; }
  .dock-start.leaving .hello { opacity: 0; transform: translateY(-8px); }
  .dock-start.leaving .choice, .dock-start.swap .choice { transform: translateY(calc(100% + 60px)); }
  .choice.rise { transition: transform 420ms var(--ease), border-color 300ms ease, box-shadow 300ms ease; }

  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .toast {
    position: fixed; left: 50%; top: 64px; z-index: 5; width: max-content; max-width: calc(100% - 32px); box-sizing: border-box;
    transform: translate(-50%, -8px); opacity: 0; pointer-events: none;
    background: var(--surface-2); color: var(--ink); border: 1px solid var(--line-strong); border-radius: 14px;
    padding: 10px 14px; font-size: 13px; font-weight: 600; text-align: center; box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    transition: opacity 280ms ease, transform 420ms var(--ease);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  /* Niskie ekrany: przyciski trybu bez opisów, żeby powitanie nie wchodziło na kadr */
  @media (max-height: 760px) {
    .choice { padding: 12px 10px 11px; gap: 4px; }
    .choice svg { width: 34px; height: 34px; }
    .choice .desc { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .director-only, .hello, .tile, .cat, .choice, .chip { transition-duration: 0.01ms !important; }
  }

  /* ---------- Kreska szkicu sceny ---------- */
  .ink * { vector-effect: non-scaling-stroke; stroke: currentColor; stroke-width: 1.4; stroke-linejoin: round; stroke-linecap: round; fill: none; }
  .ink .fig path, .ink .fig circle, .ink .fig ellipse { fill: var(--fig-body); stroke: var(--fig-line); }
  .ink .glow path, .ink .glow circle, .ink .glow ellipse { fill: var(--glow); stroke: var(--glow); stroke-width: 7; }
  .ink .thin { stroke-width: 1; opacity: 0.35; }
  .ink .dash { stroke-dasharray: 4 4; }
  .ink .grabbed * { stroke: var(--accent); }
  .ink .zone { fill: none; stroke: var(--accent); stroke-width: 1.2; opacity: 0.45; stroke-dasharray: 2 3; }
  .ink .zone.near { fill: var(--accent-soft); opacity: 1; stroke-dasharray: none; }
  .ink .corner { stroke: var(--accent); stroke-width: 2; }
  .ink .frame { stroke: rgba(255, 255, 255, 0.14); }
  /* Wycięcie pod ikonami sceny: linie tła nie przechodzą przez aparat ani lampę */
  .ink .halo { fill: var(--halo, var(--bg)); stroke: none; }
  .ink .prop { fill: #3A3833; stroke: #8E8A80; }
  .ink .prop-line { stroke: #8E8A80; stroke-width: 2.5; }
</style>

<div class="screen app" id="app" data-phase="start">
  <div class="top">
    <span class="combos" id="combos">Ponad miliard ujęć</span>
    <div class="modes director-only" role="group" aria-label="Tryb">
      <button class="chip" type="button" id="mode-photo" data-mode="photo"><span class="patch" style="background:#D67E2C"></span>Zdjęcie</button>
      <button class="chip" type="button" id="mode-video" data-mode="video"><span class="patch" style="background:#AF363C"></span>Wideo</button>
    </div>
    <button class="chip mat" type="button" id="material" aria-label="Zmień materiał Manikuna"><span class="swatch" id="swatch"></span><span id="material-name">Drewno</span></button>
    <button class="chip director-only" type="button" id="copy">Kopiuj</button>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <div class="stage">
    <svg id="preview" class="ink" role="img" aria-label="Podgląd kadru z Manikunem" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="readout director-only" id="readout"></div>
  </div>

  <!-- Dół ekranu: stała wysokość. Na starcie przykryty powitaniem i wyborem trybu. -->
  <div class="dock">
    <div class="options" id="panelWrap" role="group" aria-label="Opcje"></div>
    <nav class="bar" id="bar" aria-label="Kategorie"></nav>
  <div class="dock-start" id="dockStart">
    <div class="hello">
      <h1 id="line1">Cześć, jestem <em>Manikun</em>.</h1>
      <p id="line2">Wirtualny reżyser ujęć: ustaw na mnie scenę, a ja napiszę gotowy prompt do zdjęcia lub wideo AI.</p>
    </div>
    <div class="choices" role="group" aria-label="Tryb">
      <button class="choice" type="button" id="pick-photo" data-mode="photo" aria-pressed="false">
        <svg viewBox="0 0 48 48" class="ink" aria-hidden="true">
          <path d="M6 16h8l3-5h14l3 5h8v22H6z"/>
          <circle cx="24" cy="26" r="7"/>
          <circle cx="24" cy="26" r="3"/>
          <path d="M36 20h3"/>
        </svg>
        <span class="name"><span class="patch" style="background:#D67E2C"></span>Zdjęcie</span>
        <span class="desc">Jeden kadr: poza, światło, tło</span>
      </button>
      <button class="choice" type="button" id="pick-video" data-mode="video" aria-pressed="false">
        <svg viewBox="0 0 48 48" class="ink" aria-hidden="true">
          <path d="M7 20h34v19H7z"/>
          <path d="M6 13l33-7 1.6 7L7.6 20z"/>
          <path d="M14 11.4l4 6.6 M22 9.7l4 6.6 M30 8l4 6.6"/>
          <path d="M14 20l4 6 M22 20l4 6 M30 20l4 6" class="thin"/>
        </svg>
        <span class="name"><span class="patch" style="background:#AF363C"></span>Wideo</span>
        <span class="desc">Ujęcie z ruchem kamery</span>
      </button>
    </div>
  </div>

  </div>
</div>

<script src="manikun.js"></script>
<script>

  // ---------- Szablon: kategorie, opcje, frazy promptu ----------
  const SELFIE_PROMPT = "Selfie taken from the smartphone's own point of view: the picture is captured by the front camera of a phone the subject holds at arm's length slightly above eye level, so the phone itself is not visible in the frame; the subject looks straight into the lens, close personal perspective with a slight wide-angle look";
  const CATEGORIES = [
    // Gotowe schematy: zestawy ustawień do szybkiego startu (osobne dla postaci i obiektu), kafelki buduje presetTiles()
    { id: "preset", label: "Gotowe", patch: "#C9A24A", options: [] },
    // Styl obrazu: zmienia opis na początku i końcówkę promptu; w podglądzie tylko ramka kadru
    { id: "style", label: "Styl", patch: "#B08CFF", options: [
      { id: "real", name: "Realistyczny", short: "Realist." },
      { id: "cinema", name: "Filmowy", short: "Filmowy" },
      { id: "anime", name: "Manga / Anime", short: "Anime" },
      { id: "toon", name: "Bajkowy 3D", short: "Bajkowy" },
      { id: "cyber", name: "Cyberpunk", short: "Cyberpunk" },
      { id: "comic", name: "Komiks", short: "Komiks" },
      { id: "water", name: "Akwarela", short: "Akwarela" },
      { id: "vintage", name: "Vintage", short: "Vintage" },
      { id: "noir", name: "Noir", short: "Noir" },
      { id: "fantasy", name: "Fantasy", short: "Fantasy" }
    ]},
    { id: "format", label: "Format", patch: "#E0A32E" },
    // Obiekt: przedmiot, podstawa i kolor; reszta (kamera, światło, tło, pora dnia) wspólna z postacią
    { id: "item", label: "Obiekt", subjects: ["object"], patch: "#6E8B4A", options: [
      { id: "bottle", name: "Butelka", short: "Butelka" }, { id: "serum", name: "Kosmetyk", short: "Kosmetyk" },
      { id: "mug", name: "Kubek", short: "Kubek" }, { id: "sneaker", name: "But", short: "But" },
      { id: "watch", name: "Zegarek", short: "Zegarek" }, { id: "bag", name: "Torebka", short: "Torebka" },
      { id: "phone", name: "Telefon", short: "Telefon" }, { id: "food", name: "Jedzenie", short: "Jedzenie" }
    ]},
    { id: "base", label: "Podstawa", subjects: ["object"], patch: "#8E7A62", options: [

      const sy = hy + 6 * s;
      el("rect", { x: f(hx - 26 * s), y: f(sy - 62 * s), width: f(5 * s), height: f(62 * s), rx: f(1.5 * s), class: "prop" }, g);
      el("path", { d: `M${f(hx - 14 * s)},${f(sy + 4 * s)} L${f(hx - 14 * s)},${f(G)} M${f(hx + 30 * s)},${f(sy + 4 * s)} L${f(hx + 30 * s)},${f(G)} M${f(hx - 24 * s)},${f(sy + 4 * s)} L${f(hx - 24 * s)},${f(G - 2 * s)}`, class: "prop-line" }, g);
      el("rect", { x: f(hx - 26 * s), y: f(sy), width: f(60 * s), height: f(5 * s), rx: f(1.5 * s), class: "prop" }, g);
    } else if (kind === "stone") {
      const top = hy + 5 * s, x0 = hx - 26 * s, x1 = hx + 30 * s;
      el("path", { d: `M${f(x0)},${f(G)} C${f(x0 - 4 * s)},${f(top + 10 * s)} ${f(hx - 14 * s)},${f(top - 2 * s)} ${f(hx + 2 * s)},${f(top)} C${f(hx + 20 * s)},${f(top + 1 * s)} ${f(x1 + 6 * s)},${f(top + 8 * s)} ${f(x1)},${f(G)} Z`, class: "prop" }, g);
    }
  }

  const figCache = {};
  // Ubranko na Manikunie dla każdego ubioru: kolory przygaszone, jak reszta sceny
  const CLOTHES = {
    casual: { top: "#7D8A96", sleeve: "short", pants: "#3F4B5E" },
    elegant: {
      male: { top: "#2F3440", sleeve: "long", topLen: "hip", pants: "#2F3440", collar: "#E9E6DF", tie: "#7A3E3E" },
      female: { top: "#3A3F4B", sleeve: "long", topLen: "hip", pants: "#3A3F4B", collar: "#E9E6DF" }
    },
    sport: { top: "#5E7F8F", sleeve: "none", pants: "#33373E" },
    street: { top: "#8A7A66", sleeve: "long", topLen: "hip", loose: true, hood: true, pants: "#4A4F57" },
    coat: { top: "#7A6450", sleeve: "long", topLen: "hip", pants: "#3C3F45", skirt: "#7A6450", skirtLen: 0.25 },
    dress: { top: "#8E5A5E", sleeve: "short", skirt: "#8E5A5E", skirtLen: 0.35 }
  };
  // Ubranko z kolorami wybranymi przez użytkownika: góra (z połami płaszcza lub spódnicą sukienki) i dół
  function clothOf(outfitId, bodyId, topId = scene.topColor, bottomId = scene.bottomColor) {
    const o = outfitId === "dress" && bodyId !== "female" ? "casual" : outfitId;
    let c = CLOTHES[o];
    if (c && c.top === undefined) c = c[bodyId];
    c = { ...c };
    if (topId !== "auto") {
      if (c.skirt) c.skirt = colorOf(topId).hex;
      c.top = colorOf(topId).hex;
    }
    if (bottomId !== "auto" && c.pants) c.pants = colorOf(bottomId).hex;
    c.look = { ...lookDraw(scene.look, bodyId), expr: exprOf(scene) };
    return c;
  }

  function buildFigure(poseId, bodyId = "male", outfitId = null) {
    const key = [poseId, bodyId, outfitId, outfitId && scene.topColor, outfitId && scene.bottomColor, outfitId && JSON.stringify(scene.look), outfitId && exprOf(scene)].join("/");
    return figCache[key] || (figCache[key] = computeFigure(poseOf(poseId), BODIES[bodyId], outfitId ? clothOf(outfitId, bodyId) : null));
  }

  // Wzorzec skali: stojący mężczyzna. Każda poza ma ten sam rozmiar ciała, kobieta jest nieco niższa.
  const REF = buildFigure("stand", "male").box;

  // Materiał Manikuna: drewno albo biały (przełącznik w pasku górnym)
  let material = MATERIALS[0];

  // Umieszcza manekina w kadrze W×H. Skala zależy tylko od kadru i postaci stojącej.
  // anchorX: środek pozy bazowej w układzie manekina, żeby gesty nie przesuwały postaci w kadrze.
  // far: oddalenie ujęcia z drona (0..1), postać robi się mniejsza, widać więcej otoczenia
  function place(fig, shot, W, H, anchorX, far = 0) {
    const b = fig.box;
    let scale, x, y, groundY;
    if (shot === "face") {
      // Zbliżenie na twarz: głowa wypełnia większość kadru
      scale = (H * 0.5) / (REF.h * 0.15);
      y = H * 0.46 - (fig.head[1] - b.minY) * scale;
      x = W / 2 - (fig.head[0] - b.minX) * scale;
      groundY = y + b.h * scale;
    } else if (shot === "portrait") {
      scale = (H * 0.78) / (REF.h * 0.42);
      const headY = H * 0.1 + 16 * scale;
      y = headY - (fig.head[1] - b.minY) * scale;
      x = W / 2 - (fig.head[0] - b.minX) * scale;
      groundY = y + b.h * scale;
    } else {
      groundY = H * 0.86;
      scale = (groundY - H * 0.14) / REF.h * (1 - 0.42 * far);
      const ax = anchorX === undefined ? (b.minX + b.maxX) / 2 : anchorX;
      x = W / 2 - (ax - b.minX) * scale;
      y = groundY - b.h * scale;
    }
    const toScene = p => [x + (p[0] - b.minX) * scale, y + (p[1] - b.minY) * scale];
    return { fig, scale, x, y, w: b.w * scale, h: b.h * scale, groundY, head: toScene(fig.head), hip: toScene([0, 0]), hand: fig.hands && fig.hands.far ? toScene(fig.hands.far) : null, handNear: fig.hands && fig.hands.near ? toScene(fig.hands.near) : null };
  }

  function drawFigureAt(parent, pl, cls) {
    const b = pl.fig.box;
    const holder = el("svg", {
      viewBox: `${f(b.minX)} ${f(b.minY)} ${f(b.w)} ${f(b.h)}`,
      x: f(pl.x), y: f(pl.y), width: f(pl.w), height: f(pl.h), overflow: "visible"
    }, parent);
    paintFigure(el("g", { class: cls }, holder), pl.fig.shapes, cls === "fig" ? material : null);
  }

  function arrow(parent, x1, y1, x2, y2, size, cls = "") {
    el("line", { x1: f(x1), y1: f(y1), x2: f(x2), y2: f(y2), class: cls }, parent);
    const a = Math.atan2(y2 - y1, x2 - x1);
    const p = t => [x2 - size * Math.cos(a + t), y2 - size * Math.sin(a + t)];
    const l = p(0.45), r = p(-0.45);
    el("path", { d: `M${f(l[0])},${f(l[1])} L${f(x2)},${f(y2)} L${f(r[0])},${f(r[1])}` }, parent);
  }

  // Telefon do selfie: ekranem do Manikuna, obiektyw w rogu
  function phoneGlyph(parent, cx, cy, s) {
    el("rect", { x: f(cx - s * 0.3), y: f(cy - s * 0.52), width: f(s * 0.6), height: f(s * 1.04), rx: f(s * 0.1), style: "fill:#1E1F24;stroke:#F4F4F5;stroke-width:1.6" }, parent);
    el("circle", { cx: f(cx + s * 0.12), cy: f(cy - s * 0.36), r: f(s * 0.07), style: "fill:#F4F4F5;stroke:none" }, parent);
  }

  // Dron: korpus, cztery ramiona z wirnikami i mała kamera pod spodem
  function droneGlyph(parent, cx, cy, s) {
    const a = s * 0.62, rr = s * 0.3;
    [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([dx, dy]) => {
      el("line", { x1: f(cx), y1: f(cy), x2: f(cx + dx * a), y2: f(cy + dy * a * 0.55) }, parent);
      el("ellipse", { cx: f(cx + dx * a), cy: f(cy + dy * a * 0.55), rx: f(rr), ry: f(rr * 0.32) }, parent);
    });
    el("rect", { x: f(cx - s * 0.26), y: f(cy - s * 0.16), width: f(s * 0.52), height: f(s * 0.32), rx: f(s * 0.08) }, parent);
    el("circle", { cx: f(cx), cy: f(cy + s * 0.3), r: f(s * 0.11) }, parent);
  }

  function cameraGlyph(parent, cx, cy, s) {
    el("rect", { x: f(cx - s * 0.7), y: f(cy - s * 0.45), width: f(s * 1.1), height: f(s * 0.9), rx: f(s * 0.12) }, parent);
    el("path", { d: `M${f(cx + s * 0.4)},${f(cy - s * 0.25)} L${f(cx + s * 0.8)},${f(cy - s * 0.45)} L${f(cx + s * 0.8)},${f(cy + s * 0.45)} L${f(cx + s * 0.4)},${f(cy + s * 0.25)} Z` }, parent);
  }

  // Punkty odniesienia sceny: manekin (animowany i bazowy), horyzont, pozycje lampy
  // Oddalenie przy dronie: w trakcie zmiany kamery płynne (props.drone), inaczej od razu
  const droneFar = st => st.props && st.props.drone != null ? st.props.drone : (st.camera === "D" ? 1 : 0);
  function anchors(st, W, H) {
    // Środek wyznacza sama postawa, więc gest rękami nie przesuwa Manikuna w kadrze
    const bb = buildFigure(st.pose, st.body).box, ax = (bb.minX + bb.maxX) / 2;
    const baseFig = buildFigure(poseKey(st), st.body, st.outfit);
    const far = droneFar(st);
    const plBase = place(baseFig, st.shot, W, H, ax, far);
    const pl = st.fig ? place(st.fig, st.shot, W, H, ax, far) : plBase;
    return { pl, plBase, u: H / 100, cx: pl.x + pl.w / 2 };
  }

  // ---------- Tła ----------
  const paint = (tag, attrs, fill, parent, op) =>
    el(tag, { ...attrs, style: `fill:${fill};stroke:none${op !== undefined ? `;opacity:${op}` : ""}` }, parent);
  function vGrad(defs, id, stops) {
    const gr = el("linearGradient", { id, x1: "0", y1: "0", x2: "0", y2: "1" }, defs);
    stops.forEach(([o, c]) => el("stop", { offset: o, "stop-color": c }, gr));
    return `url(#${id})`;
  }
  const peaks = (pts, W, base, H) => "M0," + f(base) + " " + pts.map(([x, h]) => `L${f(x * W)},${f(base - h * H)}`).join(" ") + ` L${f(W)},${f(base)} Z`;

  // Pora dnia na niebie: 0 = dzień (słońce wysoko), 1 = złota godzina (duże, ciepłe słońce nisko), 2 = noc (księżyc i gwiazdy)
  const TOD = { day: 0, golden: 1, night: 2 };
  // cel: widoczność słońca/księżyca w stałym miejscu nieba (0, gdy to one są źródłem światła i stoją w strefie światła)
  const skySide = st => ZONES[st.lightZone].x < 0.3 ? 0.7 : 0.3;
  function drawSky(g, defs, uid, W, H, hz, u, tod, cel = 1, skyX = 0.3) {
    const nightW = Math.max(0, Math.min(1, tod - 1)), goldW = Math.max(0, 1 - Math.abs(tod - 1));
    // Noc: granatowe przyciemnienie nieba, na nim gwiazdy
    if (nightW > 0) {
      paint("rect", { x: 0, y: 0, width: f(W), height: f(hz) }, "#0B1026", g, f(0.72 * nightW));
      for (let k = 0; k < 22; k++) {
        const x = ((k * 0.618034) % 1) * W, y = ((k * 0.414214 + 0.07) % 1) * hz * 0.85;
        paint("circle", { cx: f(x), cy: f(y), r: f(u * (k % 3 ? 0.3 : 0.45)) }, "#E9ECF5", g, f(nightW * (k % 4 ? 0.55 : 0.85)));
      }
    }
    if (goldW > 0) paint("rect", { x: 0, y: 0, width: f(W), height: f(hz) }, vGrad(defs, uid + "gh", [[0, "#6B4A5A"], [1, "#E0955A"]]), g, f(0.55 * goldW));
    // Słońce: w dzień małe i wysoko, o złotej godzinie duże i nisko nad horyzontem
    // Księżyc nocą stoi wysoko
    const t = Math.min(1, tod), sy = Math.max(H * 0.1, H * 0.13 + (hz - H * 0.26) * t);
    if (cel > 0) drawCelestial(g, defs, uid, W * skyX, sy + (H * 0.14 - sy) * nightW, u, tod, cel);
  }

  // Słońce (dzień, złota godzina) przenikające się z księżycem (noc) w punkcie x, y
  function drawCelestial(g, defs, uid, x, y, u, tod, alpha = 1) {
    const nightW = Math.max(0, Math.min(1, tod - 1)), t = Math.min(1, tod);
    const sunW = (1 - nightW) * alpha;
    if (sunW > 0) {
      const r = u * (3.8 + 2.4 * t), color = t < 0.5 ? "#FFF1C9" : "#FFB866";
      const gid = uid + "sun";
      const gr = el("radialGradient", { id: gid }, defs);
      el("stop", { offset: "0", "stop-color": color, "stop-opacity": "0.5" }, gr);
      el("stop", { offset: "1", "stop-color": color, "stop-opacity": "0" }, gr);
      paint("circle", { cx: f(x), cy: f(y), r: f(r * 3.2) }, `url(#${gid})`, g, f(sunW));
      paint("circle", { cx: f(x), cy: f(y), r: f(r) }, color, g, f(sunW * 0.95));
    }
    const moonW = nightW * alpha;
    if (moonW > 0) {
      const r = u * 3.6;
      paint("circle", { cx: f(x), cy: f(y), r: f(r * 2.6) }, "#C9D2F0", g, f(moonW * 0.12));
      paint("circle", { cx: f(x), cy: f(y), r: f(r) }, "#E8E6DA", g, f(moonW * 0.95));
      paint("circle", { cx: f(x + r * 0.45), cy: f(y - r * 0.25), r: f(r * 0.85) }, "#141A33", g, f(moonW * 0.9));
    }
  }

  // Tło z dodatkami: najpierw wariant, potem nakładki (mgła leży pasami nad horyzontem i przy ziemi)
  function drawBackground(g, defs, uid, kind, W, H, hz, gy, u, tod = 0, cel = 1, skyX = 0.3, v = null, extras = []) {
    drawBackgroundBase(g, defs, uid, kind, W, H, hz, gy, u, tod, cel, skyX, v);
    if (extras.includes("fog")) {
      [[-0.14, 0.24], [-0.07, 0.2], [0.0, 0.15], [0.06, 0.11], [0.14, 0.07]].forEach(([dy, op], k) => {
        const y = hz + dy * H;
        paint("path", { d: `M0,${f(y)} C${f(W * 0.3)},${f(y - H * 0.03)} ${f(W * 0.6)},${f(y + H * 0.03)} ${f(W)},${f(y - H * 0.01)} L${f(W)},${f(y + H * 0.07)} C${f(W * 0.6)},${f(y + H * 0.1)} ${f(W * 0.3)},${f(y + H * 0.04)} 0,${f(y + H * 0.08)} Z` }, "#D2D7DC", g, op);
      });
    }
  }
  function drawBackgroundBase(g, defs, uid, kind, W, H, hz, gy, u, tod = 0, cel = 1, skyX = 0.3, v = null) {
    // Miękka plama światła (latarnie, lampy w kawiarni)
    const glowAt = (x, y, r, color, op) => {
      const gid = uid + "l" + Math.round(x) + "_" + Math.round(y);
      const gr = el("radialGradient", { id: gid }, defs);
      el("stop", { offset: "0", "stop-color": color, "stop-opacity": op }, gr);
      el("stop", { offset: "1", "stop-color": color, "stop-opacity": "0" }, gr);
      paint("circle", { cx: f(x), cy: f(y), r: f(r) }, `url(#${gid})`, g);
    };
    if (kind === "studio") {
      // Ciemna ściana, jaśniejsza podłoga z miękkim przejściem i plama światła za postacią
      const SC = { grey: ["#2F2F36", "#24242A", "#2A2A30", "#36363D", "#2B2B31"], white: ["#BDBBB6", "#A9A7A2", "#B3B1AC", "#C7C5C0", "#B0AEA9"],
        black: ["#141417", "#101012", "#121215", "#1A1A1E", "#111114"], color: ["#3E5A5E", "#324A4E", "#34494C", "#40585C", "#314548"] }[v || "grey"];
      paint("rect", { x: 0, y: 0, width: f(W), height: f(H) }, vGrad(defs, uid + "w", [[0, SC[0]], [1, SC[1]]]), g);
      const fy = Math.min(gy, H * 0.92) - H * 0.12;
      paint("rect", { x: 0, y: f(fy), width: f(W), height: f(H - fy) }, vGrad(defs, uid + "f", [[0, SC[2]], [0.25, SC[3]], [1, SC[4]]]), g);
      const spot = el("radialGradient", { id: uid + "s" }, defs);
      el("stop", { offset: "0", "stop-color": "#FFFFFF", "stop-opacity": "0.09" }, spot);
      el("stop", { offset: "1", "stop-color": "#FFFFFF", "stop-opacity": "0" }, spot);
      paint("ellipse", { cx: f(W / 2), cy: f(H * 0.45), rx: f(Math.max(W, H) * 0.45), ry: f(H * 0.45) }, `url(#${uid}s)`, g);
      return;
    }
    if (kind === "street") {
      paint("rect", { x: 0, y: 0, width: f(W), height: f(hz) }, vGrad(defs, uid + "k", [[0, "#3A4452"], [1, "#5E6875"]]), g);
      drawSky(g, defs, uid, W, H, hz, u, tod, cel, skyX);
      // Dalszy plan: mgliste bryły miasta
      const far = [[0, 0.2], [0.08, 0.28], [0.17, 0.16], [0.28, 0.25], [0.4, 0.19], [0.52, 0.27], [0.64, 0.15], [0.75, 0.23], [0.87, 0.18], [1, 0.26]];
      far.forEach(([x, h], i) => { if (i < far.length - 1) paint("rect", { x: f(x * W), y: f(hz - h * H), width: f((far[i + 1][0] - x) * W + 1), height: f(h * H) }, "#4C535E", g); });
      // Podłoże: chodniki i jezdnia zbiegająca się do horyzontu
      paint("rect", { x: 0, y: f(hz), width: f(W), height: f(H - hz) }, vGrad(defs, uid + "g", [[0, "#34353A"], [1, "#2A2B2F"]]), g);
      paint("path", { d: `M${f(W * 0.47)},${f(hz)} L${f(W * 0.53)},${f(hz)} L${f(W * 0.98)},${f(H)} L${f(W * 0.02)},${f(H)} Z` }, "#232428", g);
      for (let k = 1; k <= 4; k++) {
        const t0 = Math.pow(k / 5, 1.6), t1 = Math.pow((k + 0.45) / 5, 1.6);
        const y0 = hz + (H - hz) * t0, y1 = hz + (H - hz) * t1, w0 = W * 0.004 * (1 + k * 1.5);
        paint("rect", { x: f(W / 2 - w0 / 2), y: f(y0), width: f(w0), height: f(y1 - y0) }, "#55565B", g, 0.8);
      }
      // Średni plan: kamienice tylko przy krawędziach, z przygaszonymi oknami
      [[0, 0.24, 0.55, "#383A40"], [0.76, 1, 0.5, "#3D342F"]].forEach(([x0, x1, h, c]) => {
        const top = hz - h * H, bx = x0 * W, bw = (x1 - x0) * W;
        paint("rect", { x: f(bx), y: f(top), width: f(bw), height: f(hz - top + (H - hz) * 0.15) }, c, g);
        for (let r = 0; r < 4; r++) for (let q = 0; q < 2; q++) {
          paint("rect", { x: f(bx + bw * (0.2 + q * 0.4)), y: f(top + H * (0.05 + r * 0.1)), width: f(bw * 0.2), height: f(H * 0.05) }, "#8A7A58", g, 0.35);
        }
      });
      if (v === "modern") {
        // Szklane biurowce przy krawędziach, z siatką okien
        [[0, 0.26, 0.8], [0.74, 1, 0.72]].forEach(([x0, x1, h]) => {
          const top = hz - h * H, bx = x0 * W, bw = (x1 - x0) * W;
          paint("rect", { x: f(bx), y: f(top), width: f(bw), height: f(hz - top + (H - hz) * 0.15) }, vGrad(defs, uid + "gl" + x0, [[0, "#5B6E86"], [1, "#39465A"]]), g);
          for (let r = 1; r < 12; r++) paint("rect", { x: f(bx), y: f(top + r * h * H / 12), width: f(bw), height: 0.8 }, "#A9C0D8", g, 0.35);
          for (let q = 1; q < 4; q++) paint("rect", { x: f(bx + q * bw / 4), y: f(top), width: 0.8, height: f(hz - top) }, "#A9C0D8", g, 0.3);
        });
      }
      if (v === "neon") {
        // Kolorowe szyldy z poświatą na kamienicach
        [[0.04, 0.3, "#FF4F9A"], [0.14, 0.42, "#35D0F0"], [0.8, 0.34, "#F2C94C"], [0.88, 0.46, "#7CF07A"]].forEach(([x, y, c]) => {
          glowAt(x * W + W * 0.04, hz - y * H * 0.6 + H * 0.02, H * 0.08, c, "0.55");
          paint("rect", { x: f(x * W), y: f(hz - y * H * 0.6), width: f(W * 0.08), height: f(H * 0.035), rx: f(H * 0.008) }, c, g, 0.9);
        });
      }
      if (v === "rain") {
        // Mokry asfalt: odbicia świateł i kałuże
        [[0.3, 0.72, "#F2C94C"], [0.68, 0.8, "#E8EEF5"], [0.45, 0.9, "#F2C94C"]].forEach(([x, y, c]) => {
          paint("ellipse", { cx: f(x * W), cy: f(y * H), rx: f(W * 0.09), ry: f(H * 0.012) }, "#6F7A86", g, 0.45);
          paint("rect", { x: f(x * W - W * 0.006), y: f(y * H - H * 0.07), width: f(W * 0.012), height: f(H * 0.07) }, c, g, 0.25);
        });
        for (let k = 0; k < 26; k++) paint("rect", { x: f(((k * 0.618) % 1) * W), y: f(((k * 0.37) % 1) * hz), width: 0.7, height: f(H * 0.04) }, "#C9D4E0", g, 0.35);
      }
      return;
    }
    if (kind === "mountains") {

        for (let k = 0; k < 14; k++) { const y = hz + H * 0.04 + (H - hz) * (k / 14); paint("rect", { x: 0, y: f(y), width: f(W), height: 0.8 }, "#D8C07A", g, 0.35); }
      }
      if (v === "tree") {
        // Samotne drzewo na wzgórzu po lewej
        const tx = W * 0.22, ty = hz - H * 0.06;
        paint("rect", { x: f(tx - W * 0.008), y: f(ty - H * 0.07), width: f(W * 0.016), height: f(H * 0.07) }, "#3A2E24", g);
        paint("circle", { cx: f(tx), cy: f(ty - H * 0.1), r: f(H * 0.055) }, "#3E5234", g);
        paint("circle", { cx: f(tx - W * 0.04), cy: f(ty - H * 0.08), r: f(H * 0.04) }, "#44593A", g);
        paint("circle", { cx: f(tx + W * 0.04), cy: f(ty - H * 0.085), r: f(H * 0.042) }, "#3A4E31", g);
      }
      return;
    }
    if (kind === "room") {
      paint("rect", { x: 0, y: 0, width: f(W), height: f(H) }, vGrad(defs, uid + "w", [[0, "#3A3531"], [1, "#2E2A27"]]), g);
      const fy = Math.min(gy, H * 0.92) - H * 0.12;
      paint("rect", { x: 0, y: f(fy), width: f(W), height: f(H - fy) }, vGrad(defs, uid + "f", [[0, "#3C3129"], [1, "#2B231D"]]), g);
      paint("rect", { x: 0, y: f(fy - H * 0.012), width: f(W), height: f(H * 0.012) }, "#46403A", g);
      for (let k = 1; k < 4; k++) paint("rect", { x: 0, y: f(fy + (H - fy) * k / 4), width: f(W), height: 1 }, "#FFFFFF", g, 0.05);
      // Okno przy lewej krawędzi
      const wx = W * 0.03, wy = H * 0.07, ww = W * 0.22, wh = H * 0.35;
      paint("rect", { x: f(wx), y: f(wy), width: f(ww), height: f(wh) }, "#55606C", g);
      const px = wx + ww * 0.08, py = wy + wh * 0.06, pw = ww * 0.84, ph = wh * 0.88;
      paint("rect", { x: f(px), y: f(py), width: f(pw), height: f(ph) }, vGrad(defs, uid + "o", [[0, "#8093A3"], [1, "#6A7886"]]), g);
      // Za oknem pora dnia: o złotej godzinie zachodzi słońce, nocą księżyc i gwiazdy
      const goldW = Math.max(0, 1 - Math.abs(tod - 1)), nightW = Math.max(0, Math.min(1, tod - 1));
      if (goldW > 0 || nightW > 0) {
        el("rect", { x: f(px), y: f(py), width: f(pw), height: f(ph) }, el("clipPath", { id: uid + "wc" }, defs));
        const pane = el("g", { "clip-path": `url(#${uid}wc)` }, g), hy = py + ph * 0.8;
        if (goldW > 0) {
          paint("rect", { x: f(px), y: f(py), width: f(pw), height: f(ph) }, vGrad(defs, uid + "og", [[0, "#7A5566"], [0.6, "#E29A5C"], [1, "#F2B56B"]]), pane, f(goldW));
          const sr = pw * 0.2, scx = px + pw * 0.62;
          paint("circle", { cx: f(scx), cy: f(hy), r: f(sr * 2.4) }, "#FFC27A", pane, f(0.25 * goldW));
          paint("circle", { cx: f(scx), cy: f(hy), r: f(sr) }, "#FFD08A", pane, f(0.95 * goldW));
        }
        if (nightW > 0) {
          paint("rect", { x: f(px), y: f(py), width: f(pw), height: f(ph) }, vGrad(defs, uid + "on", [[0, "#0E1330"], [1, "#1C2444"]]), pane, f(nightW));
          [[0.2, 0.15], [0.75, 0.3], [0.35, 0.55], [0.85, 0.62]].forEach(([sx, sy]) => paint("circle", { cx: f(px + pw * sx), cy: f(py + ph * sy), r: f(u * 0.3) }, "#E9ECF5", pane, f(0.8 * nightW)));
          const mr = pw * 0.12, mx = px + pw * 0.3, my = py + ph * 0.28;
          paint("circle", { cx: f(mx), cy: f(my), r: f(mr) }, "#E8E6DA", pane, f(0.95 * nightW));
          paint("circle", { cx: f(mx + mr * 0.45), cy: f(my - mr * 0.25), r: f(mr * 0.85) }, "#141A33", pane, f(0.9 * nightW));
        }
        // Linia zabudowy za oknem przykrywa dolną połowę słońca
        paint("rect", { x: f(px), y: f(hy), width: f(pw), height: f(py + ph - hy) }, "#3E3A40", pane, f(Math.max(goldW, nightW) * 0.95));
        // Ciepła plama zachodzącego słońca na podłodze
        if (goldW > 0) {
          const x0 = wx + ww * 0.15, x1 = wx + ww * 0.95;
          paint("path", { d: `M${f(x0)},${f(fy)} L${f(x1)},${f(fy)} L${f(x1 + W * 0.28)},${f(H)} L${f(x0 + W * 0.2)},${f(H)} Z` }, "#FFB866", g, f(0.14 * goldW));
        }
      }
      paint("rect", { x: f(wx + ww * 0.48), y: f(wy), width: f(ww * 0.04), height: f(wh) }, "#55606C", g);
      paint("rect", { x: f(wx), y: f(wy + wh * 0.48), width: f(ww), height: f(wh * 0.03) }, "#55606C", g);
      const sx = W * 0.76, sw = W * 0.3, sb = fy + H * 0.02;
      if (v === "loft") {
        // Ceglana ściana: rzędy przesuniętych cegieł za oknem i sofą
        for (let r = 0; r < 16; r++) for (let q = -1; q < 9; q++) {
          const bw = W / 8, bx = q * bw + (r % 2) * bw / 2, by = r * (fy / 16);
          paint("rect", { x: f(bx + 1), y: f(by + 1), width: f(bw - 2), height: f(fy / 16 - 2) }, "#6A4034", g, 0.35);
        }
      }
      if (v === "bedroom") {
        // Łóżko przy prawej krawędzi z poduszką
        paint("rect", { x: f(W * 0.7), y: f(sb - H * 0.14), width: f(W * 0.04), height: f(H * 0.14) }, "#4A3D33", g);
        paint("rect", { x: f(W * 0.72), y: f(sb - H * 0.08), width: f(W * 0.4), height: f(H * 0.08), rx: f(H * 0.01) }, "#8A8479", g);
        paint("rect", { x: f(W * 0.75), y: f(sb - H * 0.11), width: f(W * 0.12), height: f(H * 0.04), rx: f(H * 0.015) }, "#C9C4B8", g);
      } else if (v === "office") {
        // Biurko z monitorem
        paint("rect", { x: f(W * 0.72), y: f(sb - H * 0.12), width: f(W * 0.3), height: f(H * 0.015) }, "#5E4E40", g);
        paint("rect", { x: f(W * 0.75), y: f(sb - H * 0.105), width: f(W * 0.012), height: f(H * 0.105) }, "#4A3D33", g);
        paint("rect", { x: f(W * 0.8), y: f(sb - H * 0.24), width: f(W * 0.16), height: f(H * 0.1), rx: f(H * 0.006) }, "#1C1E24", g);
        paint("rect", { x: f(W * 0.875), y: f(sb - H * 0.14), width: f(W * 0.01), height: f(H * 0.02) }, "#2A2B30", g);
      } else {
        // Sofa przy prawej krawędzi
        paint("rect", { x: f(sx), y: f(sb - H * 0.16), width: f(sw), height: f(H * 0.1), rx: f(H * 0.02) }, "#4A4140", g);
        paint("rect", { x: f(sx - W * 0.02), y: f(sb - H * 0.08), width: f(sw), height: f(H * 0.08), rx: f(H * 0.015) }, "#55494A", g);
      }
      return;
    }
    if (kind === "cafe") {
      paint("rect", { x: 0, y: 0, width: f(W), height: f(H) }, vGrad(defs, uid + "w", [[0, "#3A2E27"], [1, "#2C231E"]]), g);
      const fy = Math.min(gy, H * 0.92) - H * 0.12;
      paint("rect", { x: 0, y: f(fy), width: f(W), height: f(H - fy) }, vGrad(defs, uid + "f", [[0, "#34291F"], [1, "#241C16"]]), g);
      // Półki z butelkami po prawej
      [0.28, 0.4].forEach(t => {
        paint("rect", { x: f(W * 0.8), y: f(H * t), width: f(W * 0.2), height: f(H * 0.008) }, "#5A4636", g);
        for (let k = 0; k < 4; k++) paint("rect", { x: f(W * (0.82 + k * 0.045)), y: f(H * (t - 0.055)), width: f(W * 0.02), height: f(H * 0.055), rx: f(W * 0.005) }, k % 2 ? "#5E6A58" : "#6E5840", g, 0.8);
      });
      // Lada przy lewej krawędzi
      paint("rect", { x: 0, y: f(fy - H * 0.14), width: f(W * 0.24), height: f(H * 0.16) }, "#4A392C", g);
      paint("rect", { x: 0, y: f(fy - H * 0.155), width: f(W * 0.26), height: f(H * 0.02) }, "#5C4736", g);
      // Lampy wiszące przy krawędziach z ciepłą poświatą
      [W * 0.12, W * 0.3, W * 0.7, W * 0.88].forEach((x, i) => {
        const y = H * (i % 3 ? 0.2 : 0.14);
        paint("rect", { x: f(x - 0.5), y: 0, width: 1.2, height: f(y) }, "#6A5A4A", g);
        glowAt(x, y + H * 0.02, H * 0.13, "#FFC47A", "0.3");
        paint("path", { d: `M${f(x - W * 0.035)},${f(y + H * 0.025)} L${f(x - W * 0.012)},${f(y)} L${f(x + W * 0.012)},${f(y)} L${f(x + W * 0.035)},${f(y + H * 0.025)} Z` }, "#2A211B", g);
      });
      const fy2 = Math.min(gy, H * 0.92) - H * 0.12;
      if (v === "bar") {
        // Bar: ciemniej, hokery przy ladzie
        paint("rect", { x: 0, y: 0, width: f(W), height: f(H) }, "#0B0806", g, 0.35);
        [0.06, 0.18].forEach(x => {
          paint("rect", { x: f(x * W - W * 0.03), y: f(fy2 - H * 0.1), width: f(W * 0.06), height: f(H * 0.015), rx: f(H * 0.006) }, "#6B4A34", g);
          paint("rect", { x: f(x * W - W * 0.004), y: f(fy2 - H * 0.085), width: f(W * 0.008), height: f(H * 0.085) }, "#2A211B", g);
        });
      }
      if (v === "restaurant") {
        // Stoliki z białymi obrusami i świeczkami
        [[0.1, 0.12], [0.88, 0.14]].forEach(([x, w]) => {
          paint("path", { d: `M${f((x - w / 2) * W)},${f(fy2 - H * 0.02)} L${f((x + w / 2) * W)},${f(fy2 - H * 0.02)} L${f((x + w / 2 + 0.02) * W)},${f(fy2 + H * 0.06)} L${f((x - w / 2 - 0.02) * W)},${f(fy2 + H * 0.06)} Z` }, "#DCD6CA", g, 0.9);
          glowAt(x * W, fy2 - H * 0.05, H * 0.05, "#FFC47A", "0.5");
          paint("rect", { x: f(x * W - W * 0.004), y: f(fy2 - H * 0.05), width: f(W * 0.008), height: f(H * 0.03) }, "#F2EBDD", g);
        });
      }
      if (v === "bakery") {
        // Chleby na półkach po prawej
        [0.28, 0.4].forEach(t => { for (let k = 0; k < 3; k++) paint("ellipse", { cx: f(W * (0.84 + k * 0.06)), cy: f(H * (t - 0.02)), rx: f(W * 0.026), ry: f(H * 0.016) }, k % 2 ? "#B07A3E" : "#C98F4E", g); });
      }
    }
  }

  // Słońce: koło z promieniami
  function sunGlyph(g, cx, cy, r) {
    el("circle", { cx: f(cx), cy: f(cy), r: f(r) }, g);
    for (let k = 0; k < 8; k++) {
      const a = k * Math.PI / 4;
      el("line", { x1: f(cx + Math.cos(a) * r * 1.5), y1: f(cy + Math.sin(a) * r * 1.5), x2: f(cx + Math.cos(a) * r * 2.2), y2: f(cy + Math.sin(a) * r * 2.2) }, g);
    }
  }
  // Lampa: klosz na przewodzie, jak lampa studyjna
  function lampGlyph(g, cx, cy, r) {
    el("path", { d: `M${f(cx)},${f(cy - r * 2.3)} L${f(cx)},${f(cy - r * 0.8)}` }, g);
    el("path", { d: `M${f(cx - r * 0.8)},${f(cy - r * 0.8)} L${f(cx + r * 0.8)},${f(cy - r * 0.8)} L${f(cx + r * 1.5)},${f(cy + r * 0.6)} L${f(cx - r * 1.5)},${f(cy + r * 0.6)} Z` }, g);
    el("path", { d: `M${f(cx - r * 0.5)},${f(cy + r * 0.6)} A${f(r * 0.5)},${f(r * 0.5)} 0 0 0 ${f(cx + r * 0.5)},${f(cy + r * 0.6)}` }, g);
  }

  // Źródło światła. kind: 0 = słońce, 1 = lampa (przy zmianie ikony się przenikają).
  // Pod ikoną jest wycięcie w kolorze tła, więc linie sceny nie przechodzą przez nią.
  function drawLamp(g, L, u, kind) {
    const r = u * 2.8 * L.k * (L.grab ? 1.25 : 1), depth = L.behind ? 0.7 : 1;
    if (L.icon <= 0) return;
    if (L.icon < 1) g = el("g", { opacity: f(L.icon) }, g);
    if (L.grab) g = el("g", { class: "grabbed" }, g);
    el("circle", { cx: f(L.x), cy: f(L.y - r * 0.4), r: f(r * 2.7), class: "halo" }, g);
    if (kind < 1) sunGlyph(el("g", { opacity: f((1 - kind) * depth) }, g), L.x, L.y, r);
    if (kind > 0) lampGlyph(el("g", { opacity: f(kind * depth) }, g), L.x, L.y, r);
  }

  // ---------- Obiekt: szkice przedmiotów w polu 100×100 (dół = 100, środek x = 50) ----------
  // Części: main (kolor przedmiotu z cieniowaniem), dark/light (odcienie), line (sama kreska) i stałe kolory detali
  const ITEMS = {
    bottle: { color: "#5E7F6A", prompt: c => `a ${c}glass bottle`, parts: [
      ["M36 100 Q32 100 32 94 L32 52 Q32 40 44 33 L44 16 L56 16 L56 33 Q68 40 68 52 L68 94 Q68 100 64 100 Z", "main"],
      ["M42 4 L58 4 L58 17 L42 17 Z", "dark"], ["M38 58 L62 58 L62 80 L38 80 Z", "light"]] },
    serum: { color: "#C8B79A", prompt: c => `a ${c}cosmetic serum bottle with a dropper cap`, parts: [
      ["M36 100 Q34 100 34 96 L34 54 Q34 46 42 46 L58 46 Q66 46 66 54 L66 96 Q66 100 64 100 Z", "main"],
      ["M44 30 L56 30 L56 46 L44 46 Z", "dark"], ["M43 21 A7 9 0 1 1 57 21 A7 9 0 1 1 43 21 Z", "dark"], ["M40 64 L60 64 L60 84 L40 84 Z", "light"]] },
    mug: { color: "#E6E3DC", prompt: c => `a ${c}ceramic coffee mug`, parts: [
      ["M66 56 Q86 56 86 72 Q86 88 66 88 L66 80 Q78 80 78 72 Q78 64 66 64 Z", "main"],
      ["M26 44 L68 44 L68 94 Q68 100 62 100 L32 100 Q26 100 26 94 Z", "main"], ["M26 44 L68 44 L68 50 L26 50 Z", "dark"]] },
    sneaker: { color: "#E6E3DC", prompt: c => `a ${c}sneaker`, parts: [
      ["M10 90 L10 76 Q12 68 22 66 L42 60 Q50 46 62 52 L72 64 Q88 68 92 80 L92 90 Z", "main"],
      ["M8 88 L94 88 L94 100 L8 100 Z", "sole"], ["M46 60 L52 70 M54 56 L60 66", "line"]] },
    watch: { color: "#7A5C44", prompt: c => `a wristwatch with a ${c}leather strap`, parts: [
      ["M40 22 L60 22 L60 100 L40 100 Z", "main"], ["M28 58 A22 22 0 1 1 72 58 A22 22 0 1 1 28 58 Z", "metal"],
      ["M33 58 A17 17 0 1 1 67 58 A17 17 0 1 1 33 58 Z", "face"], ["M50 58 L50 46 M50 58 L58 62", "line"]] },
    bag: { color: "#7E3B45", prompt: c => `a ${c}leather handbag`, parts: [
      ["M34 58 Q34 26 50 26 Q66 26 66 58 L60 58 Q60 33 50 33 Q40 33 40 58 Z", "dark"],
      ["M20 100 L26 56 L74 56 L80 100 Z", "main"], ["M26 66 L74 66", "line"], ["M46 66 L54 66 L54 74 L46 74 Z", "metal"]] },
    phone: { color: "#2B2C30", prompt: c => `a ${c}smartphone`, parts: [
      ["M36 100 Q32 100 32 96 L32 28 Q32 24 36 24 L64 24 Q68 24 68 28 L68 96 Q68 100 64 100 Z", "main"],
      ["M36 30 L64 30 L64 92 L36 92 Z", "screen"], ["M48.5 27 A1.5 1.5 0 1 1 51.5 27 A1.5 1.5 0 1 1 48.5 27 Z", "dark"]] },
    food: { color: "#E6E3DC", prompt: c => `a beautifully plated gourmet dish on a ${c}plate`, parts: [
      ["M10 94 Q10 88 50 88 Q90 88 90 94 Q90 100 50 100 Q10 100 10 94 Z", "main"],
      ["M24 90 Q26 66 50 64 Q74 66 76 90 Z", "food"], ["M36 70 A4 4 0 1 1 44 70 A4 4 0 1 1 36 70 Z", "green"],
      ["M55 74 A3 3 0 1 1 61 74 A3 3 0 1 1 55 74 Z", "red"]] }
  };
  const itemHex = (st = scene) => st.itemColor === "auto" ? ITEMS[st.item].color : colorOf(st.itemColor).hex;
  let itemSeq = 0;
  // Rysuje przedmiot: środek podstawy w (x, yBottom), skala s px na jednostkę
  function drawItem(parent, defs, kind, x, yBottom, s, color) {
    const g = el("g", { transform: `translate(${f(x - 50 * s)} ${f(yBottom - 100 * s)}) scale(${f(s)})` }, parent);
    const id = "itm" + (++itemSeq);
    const lg = el("linearGradient", { id, x1: "0", y1: "0", x2: "1", y2: "0" }, defs);
    [[0, shadeHex(color, -0.28)], [0.35, shadeHex(color, 0.18)], [0.7, color], [1, shadeHex(color, -0.35)]].forEach(([o, c]) => el("stop", { offset: o, "stop-color": c }, lg));
    const FILL = { main: `url(#${id})`, dark: shadeHex(color, -0.45), light: shadeHex(color, 0.35), sole: "#EDEAE3", metal: "#BFC3C8",
      face: "#F1EFEA", screen: "#15161A", food: "#B8743C", green: "#6E8B4A", red: "#B3262E" };
    ITEMS[kind].parts.forEach(([d, kindOf]) => {
      const style = kindOf === "line" ? "fill:none;stroke:#2A2622;stroke-width:1.4"
        : `fill:${FILL[kindOf]};stroke:#2A2622;stroke-width:1.2` + (kindOf === "light" ? ";fill-opacity:0.55" : "");
      el("path", { d, style }, g);
    });
  }
  // Wysokość podstawy nad podłożem (ułamek H) i jej rysunek; przedmiot stoi na jej górze
  const BASE_H = { table: 0.2, pedestal: 0.16, stone: 0.065, water: -0.01, float: 0.13 };
  function drawBase(parent, kind, W, H, gy, u, front) {
    const cx = W / 2, paintB = (tag, attrs, fill, op) => el(tag, { ...attrs, style: `fill:${fill};stroke:#2A2622;stroke-width:1.2` + (op !== undefined ? `;opacity:${op}` : "") }, parent);
    if (front) {
      // Woda przed przedmiotem: półprzezroczysta tafla i zmarszczki
      if (kind === "water") {
        el("ellipse", { cx: f(cx), cy: f(gy), rx: f(W * 0.3), ry: f(u * 2.6), style: "fill:#7FA2BC;fill-opacity:0.45;stroke:#CFE0EC;stroke-width:1.2" }, parent);
        el("ellipse", { cx: f(cx), cy: f(gy), rx: f(W * 0.18), ry: f(u * 1.4), style: "fill:none;stroke:#CFE0EC;stroke-width:1;opacity:0.7" }, parent);
      }
      return;
    }
    const top = gy - H * BASE_H[kind];
    if (kind === "table") {
      const w = Math.min(W * 0.84, H * 0.8);
      [-1, 1].forEach(sd => paintB("rect", { x: f(cx + sd * w * 0.4 - u * 0.9), y: f(top), width: f(u * 1.8), height: f(gy - top) }, "#4E3E31"));
      paintB("rect", { x: f(cx - w / 2), y: f(top - u * 0.4), width: f(w), height: f(u * 2.4), rx: f(u * 0.4) }, "#7A6250");
    } else if (kind === "pedestal") {
      const w = Math.min(W * 0.36, H * 0.3);
      paintB("rect", { x: f(cx - w / 2), y: f(top), width: f(w), height: f(gy - top) }, "#8D8A85");
      paintB("rect", { x: f(cx - w / 2 - u), y: f(top - u * 0.8), width: f(w + u * 2), height: f(u * 1.6), rx: f(u * 0.3) }, "#A7A49E");
    } else if (kind === "stone") {
      const w = Math.min(W * 0.36, H * 0.3);
      paintB("path", { d: `M${f(cx - w / 2)},${f(gy)} Q${f(cx - w / 2)},${f(top)} ${f(cx - w * 0.1)},${f(top)} L${f(cx + w * 0.2)},${f(top + u * 0.4)} Q${f(cx + w / 2)},${f(top + u)} ${f(cx + w / 2)},${f(gy)} Z` }, "#6E6A64");
    } else if (kind === "float") {
      el("ellipse", { cx: f(cx), cy: f(gy), rx: f(W * 0.13), ry: f(u * 1.4), style: "fill:#000;stroke:none;opacity:0.35" }, parent);
    }
  }
  // Miejsce przedmiotu w kadrze: ten sam poziom podłoża co Manikun
  function objectPlace(st, W, H) {
    const gy = H * 0.86, s = H * 0.36 / 100 * (1 - 0.42 * droneFar(st)), bottom = gy - H * BASE_H[st.base] * (1 - 0.42 * droneFar(st));
    return { x: W / 2 - 30 * s, y: bottom - 100 * s, w: 60 * s, h: 100 * s, bottom, gy, s };
  }

  // Ramka stylu: każdy styl ma własny charakter ramki i mały podpis na dole kadru
  function drawStyleFrame(svg, sty, id, W, H, u) {
    const r = Math.min(W, H) * 0.035, frame = (inset, style) => el("rect", { x: f(inset), y: f(inset), width: f(W - inset * 2), height: f(H - inset * 2), rx: f(r), style: "fill:none;" + style }, svg);
    if (id === "cinema") {
      // Kinowe pasy u góry i u dołu
      [0, H - H * 0.07].forEach(y => el("rect", { x: 0, y: f(y), width: f(W), height: f(H * 0.07), style: "fill:#000;stroke:none;opacity:0.72" }, svg));
      frame(1, `stroke:${sty.frame};stroke-width:1.6`);
    } else if (id === "cyber") {
      frame(1.5, `stroke:${sty.frame};stroke-width:2;filter:drop-shadow(0 0 3px ${sty.frame})`);
      frame(u * 1.4, `stroke:${sty.frame2};stroke-width:1;opacity:0.8`);
    } else if (id === "comic") {
      frame(1.5, "stroke:#111;stroke-width:5");
      frame(1.5, `stroke:${sty.frame};stroke-width:2`);
      for (let k = 0; k < 6; k++) for (let q = 0; q < 6 - k; q++) el("circle", { cx: f(u * (2 + q * 1.6)), cy: f(u * (2 + k * 1.6)), r: f(u * 0.45), style: `fill:${sty.frame};stroke:none;opacity:0.7` }, svg);
    } else if (id === "water") {
      frame(1.5, `stroke:${sty.frame};stroke-width:4;opacity:0.55;stroke-dasharray:14 5 3 6`);
    } else if (id === "vintage") {
      frame(1.5, `stroke:${sty.frame};stroke-width:3`);
      el("rect", { x: 0, y: 0, width: f(W), height: f(H), style: "fill:#704214;stroke:none;opacity:0.12" }, svg);
    } else if (id === "noir") {
      el("rect", { x: 0, y: 0, width: f(W), height: f(H), style: "fill:#000;stroke:none;opacity:0.18" }, svg);
      frame(1.5, `stroke:${sty.frame};stroke-width:2`);
    } else if (id === "fantasy") {
      frame(1.5, `stroke:${sty.frame};stroke-width:2`);
      [[0.08, 0.1], [0.92, 0.12], [0.1, 0.9], [0.9, 0.88]].forEach(([x, y]) => el("path", { d: `M${f(x * W)},${f(y * H - u * 1.6)} L${f(x * W + u * 0.5)},${f(y * H - u * 0.5)} L${f(x * W + u * 1.6)},${f(y * H)} L${f(x * W + u * 0.5)},${f(y * H + u * 0.5)} L${f(x * W)},${f(y * H + u * 1.6)} L${f(x * W - u * 0.5)},${f(y * H + u * 0.5)} L${f(x * W - u * 1.6)},${f(y * H)} L${f(x * W - u * 0.5)},${f(y * H - u * 0.5)} Z`, style: `fill:${sty.frame2};stroke:none` }, svg));
    } else {
      frame(1.5, `stroke:${sty.frame};stroke-width:2.2`);
    }
    // Podpis stylu na dole kadru
    const tw = sty.tag.length * u * 1.9 + u * 3, tx = W / 2 - tw / 2, ty = H - u * 7.2;
    el("rect", { x: f(tx), y: f(ty), width: f(tw), height: f(u * 3.6), rx: f(u * 1.8), style: `fill:#0B0B0D;stroke:${sty.frame};stroke-width:1;opacity:0.9` }, svg);
    const t = el("text", { x: f(W / 2), y: f(ty + u * 2.55), "text-anchor": "middle", style: `fill:${sty.frame};stroke:none;font:700 ${f(u * 2.3)}px var(--font);letter-spacing:0.08em` }, svg);
    t.textContent = sty.tag;
  }

  let clipSeq = 0;
  // Składa szkic sceny. layers: które warstwy narysować (kafelek pokazuje tylko swoją).
  function renderScene(svg, st, W, H, layers, opts = {}) {
    svg.replaceChildren();
    svg.setAttribute("viewBox", `0 0 ${f(W)} ${f(H)}`);
    const id = "clip" + (++clipSeq);
    const defs = el("defs", {}, svg);
    el("rect", { x: 0, y: 0, width: f(W), height: f(H) }, el("clipPath", { id }, defs));
    const g = el("g", { "clip-path": `url(#${id})` }, svg);

    const A = anchors(st, W, H);
    const { u } = A;
    // Obiekt albo postać: przy przejściu jedno przenika się z drugim (subj 0 = Manikun, 1 = przedmiot)
    const subj = st.props && st.props.subj != null ? st.props.subj : (st.subject === "object" ? 1 : 0);
    const ob = objectPlace(st, W, H);
    const pl = subj >= 0.5 ? { ...ob, groundY: ob.gy } : A.pl, cx = pl.x + pl.w / 2;
    // Położenie aparatu i lampy: w trakcie animacji lub przeciągania z props, inaczej środek strefy
    const P = st.props || {};
    const zc = camZone(st.camera), zl = ZONES[st.lightZone];
    let camPt = zonePt([P.camX ?? zc.x, P.camY ?? zc.y], W, H, u);
    // Selfie: telefon w dłoni Manikuna (póki nie jest przeciągany)
    const hand = st.camera === "SR" ? A.pl.handNear : A.pl.hand;
    const selfie = isSelfie(st.camera) && subj < 0.5 && hand && opts.grab !== "camera";
    if (selfie) camPt = [clamp(hand[0], u * 7, W - u * 7), clamp(hand[1] - u * 1.5, u * 7, H - u * 7)];
    const litRaw = zonePt([P.litX ?? zl.x, P.litY ?? zl.y], W, H, u);
    const lightT = P.light ?? (isBackLight(st.light) ? 1 : 0);
    const kindT = P.kind ?? (isNaturalLight(st.light) ? 0 : 1);
    // Horyzont lekko idzie za wysokością kamery: z góry widać więcej ziemi, z dołu więcej nieba
    const camN = P.camY ?? zc.y;
    const hz = H * (0.55 - (0.5 - camN) * 0.4);
    const tod = P.tod ?? TOD[st.time];
    // Słońce lub księżyc w tle stoi po przeciwnej stronie niż lampa, żeby się nie nakładały
    const skyX = P.skyX ?? skySide(st);
    // Naturalne światło na zewnątrz: źródłem jest słońce lub księżyc na niebie, bez osobnej ikony.
    // Stoi w strefie światła, ale zawsze nad horyzontem; o złotej godzinie schodzi nisko.
    const skyT = layers.has("background") ? (P.sky ?? (isOutdoor(st.background) && isNaturalLight(st.light) ? 1 : 0)) : 0;
    const goldW = Math.max(0, 1 - Math.abs(tod - 1)), low = hz - H * 0.13;
    const placeLight = pt => {
      if (skyT <= 0) return pt;
      const cy = Math.min(pt[1], low);
      return [pt[0], pt[1] + (cy + (low - cy) * goldW - pt[1]) * skyT];
    };
    const litPt = placeLight(litRaw);
    // Punkty stref do przeciągania: aparat może stanąć wszędzie, światło tylko tam, skąd naprawdę pada
    const zonePts = { camera: {}, light: {} };
    ALL_ZONES.forEach(z => { zonePts.camera[z] = zonePt([ZONES[z].x, ZONES[z].y], W, H, u); });
    lightZones(st).forEach(z => { zonePts.light[z] = placeLight(zonePts.camera[z]); });
    const horizonY = camPt[1];
    const target = [cx, pl.y + pl.h * 0.3];
    // Na starcie widać tylko Manikuna; tło, kamera, światło i ruch pojawiają się płynnie po wyborze trybu
    const reveal = st.props && st.props.reveal !== undefined ? st.props.reveal : 1;
    const layer = () => reveal >= 1 ? g : el("g", { opacity: f(reveal) }, g);

    // Tło: trzy plany z przygaszonymi kolorami; im dalej, tym jaśniej i bardziej mgliście.
    if (layers.has("background") && reveal > 0) {
      const gy = st.shot === "full" ? pl.groundY : H * 0.95;
      if (st.bgTrans) {
        // Zmiana tła: stare chowa się w dół, nowe wysuwa się spod spodu (jak rząd kafelków)
        drawBackground(el("g", { transform: `translate(0 ${f(H * st.bgTrans.oldOff)})` }, layer()), defs, id + "o", st.bgTrans.old, W, H, hz, gy, u, tod, 1 - skyT, skyX, bgVariant(st, st.bgTrans.old), bgExtras(st, st.bgTrans.old));
        drawBackground(el("g", { transform: `translate(0 ${f(H * st.bgTrans.newOff)})` }, layer()), defs, id, st.background, W, H, hz, gy, u, tod, 1 - skyT, skyX, bgVariant(st), bgExtras(st));
      } else {
        drawBackground(layer(), defs, id, st.background, W, H, hz, gy, u, tod, 1 - skyT, skyX, bgVariant(st), bgExtras(st));
      }
      // Pora dnia delikatnie zmienia całe tło (bez studia): ciepło o złotej godzinie, ciemny granat nocą
      if (st.background !== "studio") {
        const goldW = Math.max(0, 1 - Math.abs(tod - 1)), nightW = Math.max(0, Math.min(1, tod - 1));
        if (goldW > 0) el("rect", { x: 0, y: 0, width: f(W), height: f(H), style: `fill:#FF9A4A;stroke:none;opacity:${f(0.12 * goldW)}` }, layer());
        if (nightW > 0) el("rect", { x: 0, y: 0, width: f(W), height: f(H), style: `fill:#070B1E;stroke:none;opacity:${f(0.42 * nightW)}` }, layer());
      }
      // Rodzaj i kierunek światła zabarwia tło: słońce ociepla, lampa chłodzi, kontra przyciemnia
      const tint = kindT < 0.5 ? "#FFB45C" : "#7FA6FF";
      el("rect", { x: 0, y: 0, width: f(W), height: f(H), style: `fill:${tint};stroke:none;opacity:0.07` }, layer());
      if (lightT > 0) el("rect", { x: 0, y: 0, width: f(W), height: f(H), style: `fill:#000;stroke:none;opacity:${f(0.22 * lightT)}` }, layer());
    }

    // Słońce lub księżyc jako źródło światła: na niebie, za Manikunem; chwycone lekko rośnie
    if (skyT > 0 && reveal > 0) {
      const cg = el("g", { opacity: f(skyT * reveal) }, g);
      const s = opts.grab === "light" ? 1.25 : 1;
      drawCelestial(s === 1 ? cg : el("g", { transform: `translate(${f(litPt[0])} ${f(litPt[1])}) scale(${s}) translate(${f(-litPt[0])} ${f(-litPt[1])})` }, cg),
        defs, id + "c", litPt[0], litPt[1], u, tod);
    }

    // Podłoże
    if (st.shot === "full" && layers.has("ground")) {
      el("line", { x1: 0, y1: f(pl.groundY), x2: f(W), y2: f(pl.groundY), class: "thin" }, g);
    }

    // Światło: jedna lampa przelatuje łukiem z przodu (miękkie) za postać (kontra).
    // Za postacią jest mniejsza i bledsza, rysowana pod Manikunem: stoi głęboko w scenie.
    // Lampa: z przodu duża z promieniami, za Manikunem mniejsza i bledsza, rysowana pod nim
    const lamp = layers.has("light") && reveal > 0 ? {
      x: litPt[0], y: litPt[1], t: lightT, k: 1 - 0.3 * lightT, behind: lightT >= 0.5,
      rays: Math.max(0, 1 - lightT * 3), glow: Math.max(0, Math.min(1, (lightT - 0.6) / 0.4)),
      grab: opts.grab === "light", icon: 1 - skyT
    } : null;
    if (lamp && lamp.behind) drawLamp(layer(), lamp, u, kindT);
    if (lamp && lamp.glow > 0 && subj < 1) drawFigureAt(el("g", { opacity: f(lamp.glow * reveal * (1 - subj)) }, g), A.pl, "glow");

    // Ruch: tylna połowa orbity za postacią
    const orbit = { cx, cy: pl.y + pl.h * 0.62, rx: Math.max(pl.w * 0.75, W * 0.3), ry: u * 6 };
    if (layers.has("motion") && reveal > 0 && st.motion === "orbit") {
      el("path", { d: `M${f(orbit.cx - orbit.rx)},${f(orbit.cy)} A${f(orbit.rx)},${f(orbit.ry)} 0 0 1 ${f(orbit.cx + orbit.rx)},${f(orbit.cy)}`, class: "dash" }, layer());
    }

    if (subj < 1) {
      const fg = subj > 0 ? el("g", { opacity: f(1 - subj) }, g) : g;
      if (POSE_PROPS[st.pose]) drawProp(fg, POSE_PROPS[st.pose], A.plBase.hip, A.plBase.scale, A.plBase.groundY);
      drawFigureAt(fg, A.pl, "fig");
    }
    if (subj > 0) {
      const og = subj < 1 ? el("g", { opacity: f(subj) }, g) : g;
      drawBase(og, st.base, W, H, ob.gy, u, false);
      drawItem(og, defs, st.item, W / 2, ob.bottom, ob.s, itemHex(st));
      drawBase(og, st.base, W, H, ob.gy, u, true);
    }

    // Ruch: przednia połowa orbity albo najazd kamery
    if (layers.has("motion") && reveal > 0) {
      const lg = layer();
      if (st.motion === "orbit") {
        el("path", { d: `M${f(orbit.cx + orbit.rx)},${f(orbit.cy)} A${f(orbit.rx)},${f(orbit.ry)} 0 0 1 ${f(orbit.cx - orbit.rx)},${f(orbit.cy)}`, class: "dash" }, lg);
        const ax = orbit.cx + orbit.rx * 0.5, ay = orbit.cy + orbit.ry * Math.sqrt(0.75);
        arrow(lg, ax + u * 4, ay - u * 0.6, ax, ay, u * 3);
      } else {
        // Najazd: strzałka od aparatu w stronę Manikuna
        const dx = target[0] - camPt[0], dy = target[1] - camPt[1], d = Math.hypot(dx, dy) || 1;
        const a0 = u * 10, a1 = Math.max(a0 + u * 4, Math.min(a0 + u * 16, d - pl.w * 0.35 - u * 3));
        arrow(lg, camPt[0] + dx / d * a0, camPt[1] + dy / d * a0, camPt[0] + dx / d * a1, camPt[1] + dy / d * a1, u * 3.5, "dash");
      }
    }

    // Lampa z przodu: ikona i krótkie promienie w stronę postaci (nie przecinają sceny)
    if (lamp && !lamp.behind) {
      const lg = layer();
      drawLamp(lg, lamp, u, kindT);
      if (lamp.rays > 0) {
        const rg = el("g", { opacity: f(lamp.rays) }, lg);
        const [tx, ty] = target;
        const a = Math.atan2(ty - lamp.y, tx - lamp.x), r0 = u * (5.5 * lamp.k + 2.5 * skyT), r1 = r0 + u * 4;
        [-0.28, 0, 0.28].forEach(d => {
          el("line", { x1: f(lamp.x + Math.cos(a + d) * r0), y1: f(lamp.y + Math.sin(a + d) * r0), x2: f(lamp.x + Math.cos(a + d) * r1), y2: f(lamp.y + Math.sin(a + d) * r1) }, rg);
        });
      }
    }

    // Kamera na pierwszym planie (nad Manikunem i lampą), żeby łatwo ją chwycić; znak aparatu albo drona
    if (layers.has("camera") && reveal > 0) {
      const s = u * 7, [x, y] = camPt, lg = layer();
      if (!selfie) el("circle", { cx: f(x), cy: f(y), r: f(s * 1.25), class: "halo" }, lg);
      // Obiektyw zawsze skierowany na Manikuna; po prawej stronie aparat jest odbity, nie odwrócony
      const a = Math.atan2(target[1] - y, target[0] - x) * 180 / Math.PI, flip = Math.abs(a) > 90 ? -1 : 1;
      const grab = opts.grab === "camera" ? ` translate(${f(x)} ${f(y)}) scale(1.25) translate(${f(-x)} ${f(-y)})` : "";
      const cg = el("g", { transform: `rotate(${f(a)} ${f(x)} ${f(y)}) translate(${f(x)} ${f(y)}) scale(1 ${flip}) translate(${f(-x)} ${f(-y)})${grab}`, class: opts.grab === "camera" ? "grabbed" : "" }, lg);
      if (selfie) phoneGlyph(lg, x, y, s * 0.8);
      else if (st.camera === "D") droneGlyph(lg, x, y, s * (opts.grab === "camera" ? 1.25 : 1));
      else cameraGlyph(cg, x + s * 0.15, y, s);
    }

    // Strefy kotwiczenia widoczne tylko podczas przeciągania
    if (opts.zones) {
      const pts = zonePts[opts.grab];
      for (const id in pts) {
        const [zx, zy] = pts[id];
        el("circle", { cx: f(zx), cy: f(zy), r: f(u * (id === opts.zones.near ? 3.2 : 2.2)), class: id === opts.zones.near ? "zone near" : "zone" }, svg);
      }
    }

    // Rama kadru
    el("rect", { x: 0.5, y: 0.5, width: f(W - 1), height: f(H - 1), rx: f(Math.min(W, H) * 0.035), class: "frame" }, svg);
    const sty = styleOf(st);
    if (sty && (opts.corners || opts.styleFrame)) drawStyleFrame(svg, sty, st.style, W, H, u);
    if (opts.corners) {
      const c = u * 5, i = u * 3;
      [[i, i, 1, 1], [W - i, i, -1, 1], [i, H - i, 1, -1], [W - i, H - i, -1, -1]].forEach(([x, y, sx, sy]) => {
        el("path", { d: `M${f(x)},${f(y + sy * c)} L${f(x)},${f(y)} L${f(x + sx * c)},${f(y)}`, class: "corner", style: sty ? `stroke:${sty.frame}` : "" }, svg);
      });
    }
    return { camPt, litPt, zonePts, u, W, H, head: A.plBase.head };
  }

  // ---------- Ikony paska kategorii ----------
  const CAT_ICONS = {
    format: svg => el("rect", { x: 6, y: 3, width: 12, height: 18, rx: 1.5 }, svg),
    shot: svg => el("path", { d: "M4 9V4h5 M15 4h5v5 M20 15v5h-5 M9 20H4v-5" }, svg),
    camera: svg => { el("rect", { x: 3, y: 7, width: 13, height: 11, rx: 1.5 }, svg); el("path", { d: "M16 10l5-3v11l-5-3z" }, svg); },
    light: svg => isNaturalLight(scene.light) ? sunGlyph(svg, 12, 12, 4) : lampGlyph(svg, 12, 13, 4.2),
    time: svg => {
      if (scene.time === "night") { el("path", { d: "M15 4a8 8 0 1 0 5 13A6.5 6.5 0 0 1 15 4z" }, svg); return; }
      if (scene.time === "golden") { el("path", { d: "M5 17a7 7 0 0 1 14 0 M2 17h20 M12 5v3 M5.6 9.6l2 2 M18.4 9.6l-2 2" }, svg); return; }
      sunGlyph(svg, 12, 12, 4);
    },
    background: svg => { el("rect", { x: 3, y: 3, width: 18, height: 3, rx: 1.5 }, svg); el("path", { d: "M5 6v11l-2 4 M19 6v11l2 4 M5 17h14" }, svg); },
    motion: svg => { el("ellipse", { cx: 12, cy: 15, rx: 9, ry: 3.5 }, svg); el("circle", { cx: 12, cy: 5, r: 2 }, svg); el("path", { d: "M12 7v8 M15 19.4l2.4-0.8-1.4-2" }, svg); },
    body: svg => miniFigure(svg, "stand", scene.body, scene.outfit),
    pose: svg => miniFigure(svg, "sit", scene.body, scene.outfit),
    arms: svg => miniFigure(svg, "stand+hips", scene.body, scene.outfit),
    outfit: svg => outfitGlyph(svg, scene.outfit, 24),
    style: svg => { el("circle", { cx: 12, cy: 12, r: 8.5 }, svg); [[8.5, 9.5], [12.5, 7.5], [15.5, 11]].forEach(([cx, cy]) => el("circle", { cx, cy, r: 1.3, style: "fill:currentColor" }, svg)); el("path", { d: "M12 20.5c-1.5 0-2-1.5-1-2.5s2.5-.5 3-2" }, svg); },
    preset: svg => el("path", { d: "M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z" }, svg),
    item: svg => drawItem(svg, el("defs", {}, svg), scene.item, 12, 23, 0.21, itemHex()),
    base: svg => { el("path", { d: "M3 13h18 M6 13v8 M18 13v8" }, svg); el("path", { d: "M10 13V8h4v5", class: "thin" }, svg); },
    itemColor: svg => { el("circle", { cx: 12, cy: 12, r: 8, style: `fill:${itemHex()};stroke:rgba(255,255,255,0.3)` }, svg); },
    look: svg => { el("circle", { cx: 12, cy: 12, r: 7 }, svg); el("path", { d: "M5.5 10 Q7 4 12 4.5 Q17 4 18.5 10 Q14 7.5 5.5 10 Z" }, svg); el("path", { d: "M8 12.5 h3 M13 12.5 h3", class: "thin" }, svg); }
  };

  // Mały ludzik w ikonie 24×24, dopasowany do pola
  function miniFigure(svg, poseId, bodyId, outfitId = null) {
    const fig = buildFigure(poseId, bodyId, outfitId), b = fig.box, s = 22 / Math.max(b.w, b.h);
    const holder = el("svg", { viewBox: `${f(b.minX)} ${f(b.minY)} ${f(b.w)} ${f(b.h)}`, x: f(12 - b.w * s / 2), y: f(23 - b.h * s), width: f(b.w * s), height: f(b.h * s) }, svg);
    paintFigure(el("g", { class: "fig" }, holder), fig.shapes, material);

  // ---------- Interfejs ----------
  const bar = document.getElementById("bar");
  const panelWrap = document.getElementById("panelWrap");
  const preview = document.getElementById("preview");
  const lerp = (a, b, t) => a + (b - a) * t;

  function valueShort(cat) {
    if (cat.id === "format") return currentFormat().short;
    if (cat.id === "body" && scene.face) return "Moja twarz";
    if (cat.id === "preset") { const pr = lastPreset && PRESETS[scene.subject].find(p => p.id === lastPreset); return pr ? pr.name.split(" ")[0] : "Wybierz"; }
    if (cat.id === "itemColor") return scene.itemColor === "auto" ? "Domyślny" : colorOf(scene.itemColor).name;
    if (cat.id === "look") {
      const lk = scene.look;
      if (lk.expr !== "neutral") return lookOpt("expr", lk.expr).name;
      if (lk.hair !== "none") return lookOpt("hair", lk.hair).name;
      if (lk.glasses !== "none") return lookOpt("glasses", lk.glasses).name;
      if (scene.body === "male" && lk.beard !== "none") return lookOpt("beard", lk.beard).name;
      if (lk.lips !== "none") return "Usta: " + lookOpt("lips", lk.lips).name;
      return "Bez zmian";
    }
    return optionOf(cat.id, scene[cat.id]).short;
  }

  // Pasek kategorii: przebudowa tylko przy zmianie listy kategorii, poza tym aktualizacja w miejscu
  let barKey = "", barItems = [];
  // Układ domyślny: ostatni przycisk paska. Pierwsze stuknięcie pyta, drugie wraca do ekranu startowego.
  // ---------- Gotowe schematy ----------
  const LOOK0 = { hair: "none", hairColor: "auto", expr: "neutral", beard: "none", beardColor: "auto", lips: "none", glasses: "none", glassesColor: "black" };
  const PRESETS = {

  let lastPreset = null;
  function applyPreset(pr) {

  // ---------- Losowo: cała scena losowana w granicach reguł aplikacji ----------
  const anyOf = list => list[Math.floor(Math.random() * list.length)];
  function randomize() {

    scene.format[scene.mode] = anyOf(FORMATS[scene.mode]).id;
    scene.background = anyOf(leavesOf("background")).id;
    const vars = BG_VARIANTS[scene.background];
    scene.bgv = { ...scene.bgv, [scene.background]: anyOf(vars.filter(v => !v.extra)).id };
    scene.bgx = { ...scene.bgx, [scene.background]: vars.some(v => v.extra) && Math.random() < 0.25 ? ["fog"] : [] };
    scene.time = anyOf(optionsOf("time")).id;
    scene.light = anyOf(leavesOf("light")).id;
    if (scene.subject === "object") {
      scene.item = anyOf(optionsOf("item")).id;
      scene.base = anyOf(optionsOf("base")).id;
      scene.itemColor = Math.random() < 0.4 ? "auto" : anyOf(COLORS).id;
    } else {
      scene.body = anyOf(optionsOf("body")).id;
      scene.outfit = anyOf(optionsOf("outfit").filter(fit)).id;
      scene.topColor = Math.random() < 0.5 ? "auto" : anyOf(COLORS).id;
      scene.bottomColor = Math.random() < 0.5 ? "auto" : anyOf(COLORS).id;
      const male = scene.body === "male";
      scene.look = {
        hair: anyOf(LOOK.hair).id, hairColor: Math.random() < 0.4 ? "auto" : anyOf(LOOK.hairColor).id,
        expr: anyOf(LOOK.expr).id,
        beard: male && Math.random() < 0.5 ? anyOf(LOOK.beard.slice(1)).id : "none", beardColor: Math.random() < 0.5 ? "auto" : anyOf(LOOK.beardColor).id,
        lips: !male && Math.random() < 0.4 ? anyOf(LOOK.lips.slice(1)).id : "none",
        glasses: Math.random() < 0.3 ? anyOf(LOOK.glasses.slice(1)).id : "none", glassesColor: anyOf(LOOK.glassesColor).id

  function renderBar() {

  // Kafelek opcji. redraw() odświeża rysunek i zaznaczenie bez ponownej animacji wejścia.

  // Warstwy pokazywane na miniaturach danej kategorii

  // Kafelki kolorów ubrania: "Domyślny" i próbki z palety

  // Znak twarzy ze zdjęcia: ramka zdjęcia z głową w środku

  // Głowa Manikuna z danym wyglądem, powiększona na kafelek
  function headTile(svg, lk) {
    const saved = scene.look;
    scene.look = lk;
    const fig = computeFigure(POSES.stand, BODIES[scene.body], clothOf(scene.outfit, scene.body));
    scene.look = saved;
    const [hx, hy] = fig.head, r = 30;
    svg.setAttribute("viewBox", `${f(hx - r)} ${f(hy - r + 2)} ${f(r * 2)} ${f(r * 2)}`);
    paintFigure(el("g", { class: "fig" }, svg), fig.shapes, material);
  }

  // Twarz: grupy Włosy, Zarost (mężczyzna), Usta, Okulary; fryzura i okulary prowadzą dalej do kolorów
  function lookTiles() {

    return groups.map(([k, name]) => groupMark(tile("opt-look-" + k, name, () => k === "expr" ? lk.expr !== "neutral" : lk[k] !== "none",

  // Wybór opcji z listy; tło od razu otwiera swoje warianty (opcjonalne, można wrócić strzałką)
  function pickLeaf(catId, id) {

  function variantTiles(bg) {

    // Warianty wykluczają się nawzajem; dodatki ("+ Mgła") włącza się i wyłącza niezależnie
    return [backTile(parent)].concat(BG_VARIANTS[bg].map(vr => {
      if (vr.extra) {
        const on = () => bgExtras(scene, bg).includes(vr.id);
        return tile("opt-bgx-" + vr.id, "+ " + vr.name, on, () => {
          const cur = bgExtras(scene, bg);

        () => { scene.bgv = { ...scene.bgv, [bg]: vr.id }; render(); },

    }));

  function makeTiles(catId) {
    if (catId === "preset") return presetTiles();
    if (catId === "style") return optionsOf("style").map(o => tile("opt-style-" + o.id, o.name, () => scene.style === o.id,
      () => { scene.style = o.id; render(); }, svg => renderScene(svg, { ...scene, style: o.id }, 100, 100, new Set(["ground"]), { styleFrame: true, corners: false })));

      return [{ id: "auto", name: "Domyślny", hex: ITEMS[scene.item].color }, ...COLORS].map(c => tile("opt-itemColor-" + c.id, c.name,
        () => scene.itemColor === c.id, () => { scene.itemColor = c.id; render(); },
        svg => { svg.setAttribute("viewBox", "0 0 64 64"); swatch(svg, c.id === "auto" ? ITEMS[scene.item].color : c.hex, c.id === "auto"); }));
    }
    if (catId === "body") {
      // Postać i przełącznik "Moja twarz" (włącz/wyłącz, niezależnie od sylwetki)
      const list = optionsOf("body").map(o => tile("opt-body-" + o.id, o.name, () => scene.body === o.id,
        () => { scene.body = o.id; render(); }, svg => drawOption("body", o.id, svg)));
