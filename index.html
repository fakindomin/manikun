        () => scene.format[scene.mode] === fmt.id,
        () => { scene.format[scene.mode] = fmt.id; render(); },
        svg => {
          const s = 56 / Math.max(fmt.w, fmt.h), w = fmt.w * s, h = fmt.h * s;
          svg.setAttribute("viewBox", "0 0 64 64");
          el("rect", { x: f(32 - w / 2), y: f(32 - h / 2), width: f(w), height: f(h), rx: 2 }, svg);
        }));
    }
    if (scene.sub) {
      // Poziom wariantów: kafelek powrotu i warianty grupy
      const grp = optionsOf(catId).find(o => o.id === scene.sub);
      const list = [tile("opt-back", "Wróć", () => false, () => { scene.sub = null; render(); }, svg => {
        svg.setAttribute("viewBox", "0 0 64 64");
        el("path", { d: "M36 20 L24 32 L36 44 M24 32 H46" }, svg);
      })];
      list[0].btn.classList.add("back");
      grp.children.forEach(c => list.push(tile("opt-" + catId + "-" + c.id, c.name,
        () => scene[catId] === c.id,
        () => pickLeaf(catId, c.id),
        svg => drawOption(catId, c.id, svg))));
      return list;
    }
    if (catId === "outfit") {
      // Najpierw kolory bieżącego ubioru, potem same ubiory
      const extra = [colorGroupTile("topColor", scene.outfit === "dress" ? "Kolor sukienki" : "Kolor góry")];
      if (hasBottom(scene.outfit)) extra.push(colorGroupTile("bottomColor", "Kolor dołu"));
      return extra.concat(optionsOf(catId).filter(o => fitsBody(o, scene)).map(o => tile("opt-outfit-" + o.id, o.name,
        () => scene.outfit === o.id, () => { scene.outfit = o.id; render(); }, svg => drawOption("outfit", o.id, svg))));
    }
    let opts = optionsOf(catId).filter(o => fitsBody(o, scene));
    if (catId === "light" && !lampAllowed(scene)) opts = opts.filter(o => o.id !== "artificial");
    // Została jedna grupa: od razu jej warianty, bez rozwijania
    if (opts.length === 1 && opts[0].children) opts = opts[0].children;
    return opts.map(o => {
      if (!o.children) {
        return tile("opt-" + catId + "-" + o.id, o.name,
          () => scene[catId] === o.id,
          () => pickLeaf(catId, o.id),
          svg => drawOption(catId, o.id, svg));
      }
      // Kafelek grupy: wygląda jak stos kart i ma znacznik rozwinięcia
      const inGroup = () => o.children.some(c => c.id === scene[catId]);
      const t = tile("opt-" + catId + "-" + o.id, o.name, inGroup,
        () => { if (!inGroup()) scene[catId] = o.children[0].id; scene.sub = o.id; render(); },
        svg => drawOption(catId, (o.children.find(c => c.id === scene[catId]) || o.children[0]).id, svg));
      t.btn.classList.add("group");
      const badge = document.createElement("span");
      badge.className = "badge";
      badge.setAttribute("aria-hidden", "true");
      t.btn.appendChild(badge);
      return t;
    });
  }

  // Proste znaki ubrań w polu 64×64
  const OUTFIT_GLYPHS = {
    casual: ["M23 13 L12 18 L7 29 L15 33 L18 28 L18 53 L46 53 L46 28 L49 33 L57 29 L52 18 L41 13 Q32 21 23 13 Z"],
    elegant: ["M22 11 L11 17 L9 55 L55 55 L53 17 L42 11", "M22 11 L30 32 L32 55 M42 11 L34 32 L32 55", "M32 15 L29.5 19 L32 36 L34.5 19 Z"],
    sport: ["M24 9 L24 17 Q18 21 18 30 L18 55 L46 55 L46 30 Q46 21 40 17 L40 9 Q32 20 24 9 Z", "M18 40 L46 40"],
    street: ["M22 17 L12 23 L8 45 L16 47 L18 35 L18 55 L46 55 L46 35 L48 47 L56 45 L52 23 L42 17", "M22 17 Q22 6 32 6 Q42 6 42 17 Q32 24 22 17 Z", "M24 43 L40 43 L42 51 L22 51 Z", "M29 21 L29 27 M35 21 L35 27"],
    coat: ["M22 9 L12 15 L10 59 L54 59 L52 15 L42 9", "M22 9 L32 25 L42 9", "M32 25 L32 59", "M11 37 L53 37"],
    dress: ["M26 7 L26 15 L22 29 L13 57 L51 57 L42 29 L38 15 L38 7", "M22 29 L42 29", "M26 15 Q32 19 38 15"]
  };
  function outfitGlyph(svg, id, box = 64) {
    const g = el("g", { transform: `scale(${f(box / 64)})` }, svg);
    OUTFIT_GLYPHS[id].forEach(d => el("path", { d }, g));
  }

  // Rysunek na kafelku dla wariantu leafId danej kategorii
  function drawOption(catId, leafId, svg) {
    if (catId === "outfit") {
      svg.setAttribute("viewBox", "0 0 64 64");
      outfitGlyph(svg, leafId);
      return;
    }
    if (catId === "pose" || catId === "body" || catId === "arms") {
      // Jedna skala dla wszystkich kafelków z postacią: liczona z każdej pozy, układu rąk i sylwetki
      const boxes = [];
      Object.keys(POSES).forEach(pk => Object.keys(ARMS).forEach(ak => Object.keys(BODIES).forEach(bk =>
        boxes.push(buildFigure(poseKey({ pose: pk, arms: ak }), bk).box))));
      const side = Math.max(...boxes.map(b => b.w), ...boxes.map(b => b.h)) + 12;
      const poseId = catId === "pose" ? leafId : scene.pose;
      const key = poseKey({ pose: poseId, arms: catId === "arms" ? leafId : scene.arms });
      const fig = buildFigure(key, catId === "body" ? leafId : scene.body, scene.outfit), b = fig.box;
      const x = b.minX - (side - b.w) / 2, y = b.maxY + 6 - side;
      svg.setAttribute("viewBox", `${f(x)} ${f(y)} ${f(side)} ${f(side)}`);
      el("line", { x1: f(x), y1: f(b.maxY), x2: f(x + side), y2: f(b.maxY), class: "thin" }, svg);
      if (POSE_PROPS[poseId]) drawProp(svg, POSE_PROPS[poseId], [0, 0], 1, b.maxY);
      paintFigure(el("g", { class: "fig" }, svg), fig.shapes, material);
      return;
    }
    renderScene(svg, { ...scene, [catId]: leafId }, 100, 100, new Set(TILE_LAYERS[catId]));
    // Przedmiot i podstawa: kafelek przybliżony na przedmiot, żeby był dobrze widoczny
    if (catId === "item" || catId === "base") svg.setAttribute("viewBox", "16 30 68 66");
  }

  // Rząd kafelków opcji. Ta sama animacja dla każdej kategorii: stary rząd chowa się w dół,
  // nowy wysuwa się spod spodu, kafelek po kafelku. Obszar ma stałą wysokość, kadr stoi w miejscu.
  const PANEL_MS = 420, OUT_MS = 280, STEP_MS = 40;
  let panelCat = null, panelEl = null, panelTiles = [];

  function syncPanel() {
    // Sukienka nie ma koloru dołu: przy zmianie na nią i z niej rząd kafelków ubioru się przebudowuje
    const want = scene.open ? scene.open + (scene.sub ? "/" + scene.sub : "") + (scene.open === "outfit" && !hasBottom(scene.outfit) ? "#dress" : "") : null;
    if (want === panelCat) { panelTiles.forEach(t => t.redraw()); return; }
    panelCat = want;
    const fast = reduceMotion.matches;

    const old = panelEl, oldTiles = panelTiles;
    if (old) {
      if (fast) old.remove();
      else {
        oldTiles.forEach((t, i) => { t.btn.style.transitionDelay = (i * 25) + "ms"; t.btn.classList.add("out"); });
        setTimeout(() => old.remove(), OUT_MS + oldTiles.length * 25 + 60);
      }
    }
    panelEl = null;
    panelTiles = [];
    if (!want) return;

    panelEl = document.createElement("div");
    panelEl.className = "panel";
    panelWrap.appendChild(panelEl);
    panelTiles = makeTiles(scene.open);
    if (fast) return;

    panelTiles.forEach(t => { t.btn.style.transition = "none"; t.btn.classList.add("below"); });
    panelEl.offsetWidth; // zatwierdź pozycję pod spodem przed animacją
    const start = old ? 140 : 0;
    panelTiles.forEach((t, i) => {
      t.btn.style.transition = "";
      t.btn.style.transitionDelay = (start + i * STEP_MS) + "ms";
    });
    requestAnimationFrame(() => panelTiles.forEach(t => t.btn.classList.remove("below")));
    const tiles = panelTiles;
    setTimeout(() => tiles.forEach(t => { t.btn.style.transitionDelay = ""; }), start + PANEL_MS + tiles.length * STEP_MS);
  }

  // ---------- Animacja: jedna pętla dla Manikuna, kamery i światła ----------
  let shown = null;                          // widoczna poza i proporcje
  let figAnim = null;                        // kolejka klatek kluczowych Manikuna
  const props = { camX: null, camY: null, litX: null, litY: null, light: null, kind: null, tod: null, sky: null, skyX: null, subj: null, drone: null, reveal: 0 };  // widoczny stan kamery, lampy i odsłonięcia sceny (0..1)
  const propAnim = {};
  const PROP_MS = 1200;
  let loopFrame = null, lastScene = null;
  // Przejście tła: te same czasy i krzywe co przy zmianie rzędu kafelków (wyjście 280 ms, wejście 420 ms po 140 ms)
  let bgTrans = null;
  const easeOut = t => 1 - Math.pow(1 - t, 5);   // ≈ cubic-bezier(0.22, 1, 0.36, 1)
  const easeIn = t => t * t;                      // ≈ cubic-bezier(0.4, 0, 1, 1)

  const targetProps = () => ({
    camX: camZone(scene.camera).x, camY: camZone(scene.camera).y,
    litX: ZONES[scene.lightZone].x, litY: ZONES[scene.lightZone].y,
    light: isBackLight(scene.light) ? 1 : 0, kind: isNaturalLight(scene.light) ? 0 : 1,
    tod: TOD[scene.time], sky: isOutdoor(scene.background) && isNaturalLight(scene.light) ? 1 : 0,
    skyX: skySide(scene),
    subj: scene.subject === "object" ? 1 : 0,
    drone: scene.camera === "D" ? 1 : 0
  });
  const PROP_KEYS = ["camX", "camY", "litX", "litY", "light", "kind", "tod", "sky", "skyX", "subj", "drone"];
  const baseShown = () => ({ pose: curPose(), rig: BODIES[scene.body] });
  const ensureLoop = () => { if (!loopFrame) loopFrame = requestAnimationFrame(tick); };

  function tick(now) {
    loopFrame = null;
    const dt = lastTick ? Math.min(64, now - lastTick) : 16;
    lastTick = now;
    let active = false;
    if (figAnim) {
      const fr = figAnim.frames[figAnim.k];
      const t = Math.min(1, (now - figAnim.start) / fr.dur);
      shown = { pose: blendPose(figAnim.from.pose, fr.pose, t), rig: blendRig(figAnim.from.rig, BODIES[scene.body], t) };
      if (t >= 1) {
        figAnim.k++;
        if (figAnim.k >= figAnim.frames.length) { figAnim = null; shown = { pose: fr.pose, rig: BODIES[scene.body] }; }
        else { figAnim.from = shown; figAnim.start = now; }
      }
      if (figAnim) active = true;
    }
    for (const key in propAnim) {
      const a = propAnim[key], t = Math.min(1, (now - a.start) / a.dur);
      props[key] = a.from + (a.to - a.from) * easeInOut(t);
      if (t >= 1) delete propAnim[key]; else active = true;
    }
    if (bgTrans) {
      const e = now - bgTrans.start;
      bgTrans.oldOff = easeIn(Math.min(1, e / OUT_MS));
      bgTrans.newOff = 1 - easeOut(Math.max(0, Math.min(1, (e - 140) / PANEL_MS)));
      if (e >= 140 + PANEL_MS) bgTrans = null; else active = true;
    }
    if (gaze && followGaze(now, dt)) active = true;
    renderPreview();
    if (active) ensureLoop(); else lastTick = 0;
  }

  // Fokus na aparacie lub świetle: głowa płynnie, z lekkim opóźnieniem, śledzi obiekt, dopóki się rusza.
  // Po zatrzymaniu Manikun chwilę na niego patrzy i wraca do swojej pozy.
  let gaze = null, lastTick = 0;
  const GAZE_LAG = 160, GAZE_HOLD = 700;
  function startGaze(what, hold = false) {
    if (!gaze) gaze = { turn: 0, lean: 0 };
    Object.assign(gaze, { what, hold, release: 0 });
    figAnim = null;
    ensureLoop();
  }
  // Głowa nie ma twarzy, więc kierunek spojrzenia czyta się z boku owalu zwróconego do obiektu.
  // Obiekt z boku na wysokości oczu: głowa prosto. Wyżej: przechyla się do tyłu (broda w górę), niżej: do przodu.
  // Tuż nad głową przechył zanika, żeby głowa nie przeskakiwała między stronami.
  const headTurn = d => clamp(Math.sign(d) * (Math.abs(d) - 90) * 0.5 * Math.min(1, Math.abs(d) / 45), -34, 34);
  function followGaze(now, dt) {
    const G = previewGeom;
    if (!G) return true;
    const d = diffFromUp(angleTo(G.head, gaze.what === "camera" ? G.camPt : G.litPt));
    const k = 1 - Math.exp(-dt / GAZE_LAG);
    // Dron nad głową: Manikun unosi brodę i lekko odchyla się do tyłu
    const up = gaze.what === "camera" && scene.camera === "D";
    gaze.turn += ((up ? 16 : headTurn(d)) - gaze.turn) * k;
    gaze.lean += ((up ? 2.5 : clamp(d * 0.05, -6, 6)) - gaze.lean) * k;
    shown = { pose: variant({}, { head: gaze.turn, spine: gaze.lean }), rig: BODIES[scene.body] };
    const keys = gaze.what === "camera" ? ["camX", "camY"] : ["litX", "litY"];
    if (gaze.hold || keys.some(key => propAnim[key])) gaze.release = 0;
    else if (!gaze.release) gaze.release = now + GAZE_HOLD;
    if (gaze.release && now >= gaze.release) {
      gaze = null;
      playFrames([back(900)]);
    }
    return true;
  }

  function playFrames(frames) {
    gaze = null;
    if (reduceMotion.matches) { figAnim = null; shown = { pose: frames[frames.length - 1].pose, rig: BODIES[scene.body] }; ensureLoop(); return; }
    figAnim = { frames, k: 0, from: shown, start: performance.now() };
    ensureLoop();
  }

  function renderPreview() {
    const fmt = currentFormat();
    const H = 300, W = H * fmt.w / fmt.h;
    const layers = ["ground", "camera", "light", "background"];
    if (scene.mode === "video" && !isSelfie(scene.camera)) layers.push("motion");
    const st = { ...scene, props: { ...props } };
    if (bgTrans && bgTrans.newOff !== undefined) st.bgTrans = bgTrans;
    if (shown && (figAnim || shown.pose !== curPose() || shown.rig !== BODIES[scene.body])) {
      st.fig = computeFigure(shown.pose, shown.rig, clothOf(scene.outfit, scene.body));
    }
    const grabbed = drag && drag.grabbed ? drag.what : null;
    previewGeom = renderScene(preview, st, W, H, new Set(layers), { corners: true, grab: grabbed, zones: grabbed ? { near: drag.near } : null });
    const ro = document.getElementById("readout");
    ro.replaceChildren();
    if (scene.mode === "video") { const d = document.createElement("span"); d.className = "rec"; ro.appendChild(d); }
    ro.append(grabbed
      ? (grabbed === "camera" ? "Kamera" : "Światło") + " → " + camZone(drag.near).name
      : READOUT[scene.mode] + " · " + fmt.short);
  }

  // Poza bazowa z nałożonymi zmianami: abs podmienia kąty, rel je dodaje
  const variant = (abs = {}, rel = {}) => {
    const p = { ...curPose(), ...abs };
    for (const key in rel) p[key] += rel[key];
    return p;
  };

  // Kierunek od głowy do obiektu jako kąt manekina (180 = w górę)
  const angleTo = (from, to) => Math.atan2(to[0] - from[0], to[1] - from[1]) * 180 / Math.PI;
  const diffFromUp = a => ((a - 180 + 540) % 360) - 180;

  // Reakcje: kilka wariantów każdej, losowane bez powtórzenia poprzedniego
  const lastVariant = {};
  function pick(kind, list) {
    let i = Math.floor(Math.random() * list.length);
    if (list.length > 1 && i === lastVariant[kind]) i = (i + 1) % list.length;
    lastVariant[kind] = i;
    return list[i]();
  }
  const back = dur => ({ pose: curPose(), dur });

  // Reakcje na zmiany ustawień: tylko głowa i lekkie pochylenie tułowia, ręce zostają w pozie
  const REACTIONS = {
    // Więcej miejsca: spokojnie się rozgląda
    bigger: () => pick("bigger", [
      () => [{ pose: variant({}, { head: 16, spine: 2 }), dur: 700 }, { pose: variant({}, { head: -16, spine: -2 }), dur: 1000 }, back(900)],
      () => [{ pose: variant({}, { head: -14, spine: -2 }), dur: 750 }, { pose: variant({}, { head: 12, spine: 1.5 }), dur: 1100 }, back(950)],
      () => [{ pose: variant({}, { head: 10, spine: 1 }), dur: 800 }, { pose: variant({}, { head: 12, spine: 1 }), dur: 500 }, { pose: variant({}, { head: -18, spine: -2 }), dur: 1100 }, back(950)]
    ]),
    // Mniej miejsca: wzdryga się, jakby kadr miał go zgnieść, i powoli się uspokaja
    smaller: () => pick("smaller", [
      () => [{ pose: variant({}, { head: 14, spine: 3 }), dur: 380 }, { pose: variant({}, { head: 18, spine: 3 }), dur: 800 }, back(1100)],
      () => [{ pose: variant({}, { head: -14, spine: -4 }), dur: 400 }, { pose: variant({}, { head: -18, spine: -4 }), dur: 750 }, back(1100)],
      () => [{ pose: variant({}, { head: 10, spine: 2 }), dur: 260 }, { pose: variant({}, { head: -10, spine: -2 }), dur: 320 }, { pose: variant({}, { head: 6, spine: 1 }), dur: 420 }, back(900)]
    ])
  };

  // Czy kadr zrobił się większy czy mniejszy względem Manikuna
  const frameRoom = st => {
    const fmt = FORMATS[st.mode].find(x => x.id === st.format[st.mode]);
    return (fmt.w / fmt.h) * (st.shot === "portrait" ? 0.35 : isFaceShot(st) ? 0.15 : 1);
  };

  function sceneChanged() {
    const prev = lastScene;
    lastScene = { ...scene, format: { ...scene.format } };
    const tp = targetProps();
    if (!prev || !shown || reduceMotion.matches) {
      figAnim = null;
      shown = baseShown();
      PROP_KEYS.forEach(k => { props[k] = tp[k]; });
      props.reveal = phase === "start" ? 0 : 1;
      for (const k in propAnim) delete propAnim[k];
      ensureLoop();
      return;
    }
    // Kamera i lampa przesuwają się płynnie do nowego miejsca
    PROP_KEYS.forEach(k => {
      if (props[k] !== tp[k] && (!propAnim[k] || propAnim[k].to !== tp[k])) {
        propAnim[k] = { from: props[k], to: tp[k], start: performance.now(), dur: PROP_MS };
      }
    });
    if (poseKey(prev) !== poseKey(scene) || prev.body !== scene.body) playFrames([{ pose: curPose(), dur: 950 }]);
    else if (frameRoom(scene) > frameRoom(prev) + 1e-6) playFrames(REACTIONS.bigger());
    else if (frameRoom(scene) < frameRoom(prev) - 1e-6) playFrames(REACTIONS.smaller());
    else if (prev.outfit !== scene.outfit || prev.topColor !== scene.topColor || prev.bottomColor !== scene.bottomColor || prev.look !== scene.look) playFrames([{ pose: variant({}, { head: 14, spine: 2 }), dur: 650 }, { pose: variant({}, { head: -12, spine: -1 }), dur: 800 }, back(850)]);
    else if (prev.camera !== scene.camera) startGaze("camera");
    else if (prev.light !== scene.light || prev.lightZone !== scene.lightZone) startGaze("light");
    if (prev.background !== scene.background && !reduceMotion.matches) {
      bgTrans = { old: prev.background, start: performance.now() };
      // Nowe miejsce: Manikun się rozgląda
      if (!figAnim && !gaze) playFrames(REACTIONS.bigger());
    }
    ensureLoop();
  }

  function render() {
    document.body.dataset.mode = scene.mode;
    document.querySelectorAll(".modes .chip").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === scene.mode)));
    if (phase === "director" && scene.open && !activeCats().some(c => c.id === scene.open)) scene.open = "format";
    // Dron tylko w plenerze (we wnętrzu kamera przechodzi na ujęcie z góry) i zawsze z całą sylwetką
    if (scene.camera === "D" && !isOutdoor(scene.background)) scene.camera = "T";
    if (scene.camera === "D" && scene.shot !== "full") scene.shot = "full";
    // Selfie tylko z postacią
    if (scene.subject === "object" && isSelfie(scene.camera)) scene.camera = "L2";
    // Ubiór, który nie pasuje do postaci, wraca do codziennego
    if (!fitsBody(optionOf("outfit", scene.outfit), scene)) scene.outfit = "casual";
    // Lampa w pełnym słońcu na zewnątrz nie ma sensu: przechodzimy na naturalne w tym samym kierunku
    if (!lampAllowed(scene) && !isNaturalLight(scene.light)) scene.light = scene.light.replace("art-", "nat-");
    // Strefa, z której to światło nie może padać: przeskakuje do najbliższej dozwolonej
    const okZones = lightZones(scene);
    if (!okZones.includes(scene.lightZone)) scene.lightZone = nearestZone(ZONES[scene.lightZone].x, ZONES[scene.lightZone].y, 1, 1, okZones);
    renderBar();
    if (phase === "director") syncPanel();
    sceneChanged();
  }

  document.querySelectorAll(".modes .chip").forEach(b => b.addEventListener("click", () => {
    if (scene.mode === b.dataset.mode) return;
    scene.mode = b.dataset.mode;
    // Format ma inne opcje w każdym trybie: panel formatu buduje się od nowa
    if (panelCat === "format") panelCat = "__rebuild";
    render();
  }));

  // Kopiowanie bez pokazywania tekstu promptu
  const copyBtn = document.getElementById("copy");
  let copyTimer;
  function copyStatus(text) {
    copyBtn.textContent = text;
    clearTimeout(copyTimer);
    copyTimer = setTimeout(() => { copyBtn.textContent = "Kopiuj"; }, 2000);
  }
  function hiddenCopy(text) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;left:-9999px;top:0;opacity:0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    ta.remove();
    copyStatus(ok ? "Skopiowano" : "Nie udało się");
  }
  // Przy "Mojej twarzy" przypomnienie, że zdjęcie trzeba dołączyć w generatorze
  const toast = document.getElementById("toast");
  let toastTimer;
  function showToast(text) {
    toast.textContent = text;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 4200);
  }
  copyBtn.addEventListener("click", () => {
    const text = buildPrompt();
    if (scene.face) showToast("Wklej prompt w generatorze i dołącz swoje zdjęcie twarzy");
    try {
      navigator.clipboard.writeText(text).then(() => copyStatus("Skopiowano")).catch(() => hiddenCopy(text));
    } catch (e) {
      hiddenCopy(text);
    }
  });

  // ---------- Start: Manikun wita się w kadrze, potem kadr zostaje, a dół zamienia się w opcje ----------
  const appEl = document.getElementById("app");
  const dock = document.getElementById("dockStart");
  let phase = "start", idleTimer = null;
  const MP = MASCOT_POSES;

  const greet = () => playFrames([
    { pose: MP.waveA, dur: 900 }, { pose: MP.waveB, dur: 480 }, { pose: MP.waveA, dur: 480 },
    { pose: MP.waveB, dur: 480 }, { pose: MP.waveA, dur: 480 }, { pose: MP.hip, dur: 1100 }
  ]);
  const admire = () => playFrames([
    { pose: MP.lookHand, dur: 850 }, { pose: MP.lookHand2, dur: 650 }, { pose: MP.lookHand, dur: 600 },
    { pose: MP.lookArm, dur: 900 }, { pose: phase === "start" ? MP.hip : curPose(), dur: 950 }
  ]);
  // Na starcie, gdy nic się nie dzieje, co kilka sekund spokojnie przechyla głowę
  function startIdle() {
    clearTimeout(idleTimer);
    if (reduceMotion.matches || phase !== "start") return;
    idleTimer = setTimeout(() => {
      if (phase === "start" && !figAnim) playFrames([{ pose: MP.hipTilt, dur: 1300 }, { pose: MP.hip, dur: 1400 }]);
      startIdle();
    }, 5500);
  }

  // Przełącznik materiału: drewno ↔ biały, Manikun się sobie przygląda
  function paintSwatch() {
    document.getElementById("swatch").style.background = swatchCss(material);
    document.getElementById("material-name").textContent = material.name;
  }
  document.getElementById("material").addEventListener("click", () => {
    material = MATERIALS[(MATERIALS.indexOf(material) + 1) % MATERIALS.length];
    paintSwatch();
    render();
    admire();
  });
  paintSwatch();

  preview.addEventListener("click", () => { if (phase === "start") greet(); });

  // Przytrzymaj aparat albo lampę ok. 0,35 s, przeciągnij i puść: obiekt kotwiczy się w najbliższej z 8 stref
  let drag = null, previewGeom = null;
  const GRAB_MS = 350;
  function toSvg(e) {
    const pt = preview.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    return pt.matrixTransform(preview.getScreenCTM().inverse());
  }
  preview.addEventListener("pointerdown", e => {
    if (phase !== "director" || !previewGeom) return;
    const p = toSvg(e), G = previewGeom, r = G.u * 10;
    const near = pt => Math.hypot(pt[0] - p.x, pt[1] - p.y) < r;
    const what = near(G.camPt) ? "camera" : near(G.litPt) ? "light" : null;
    if (!what) return;
    preview.setPointerCapture(e.pointerId);
    drag = { what, sx: e.clientX, sy: e.clientY, grabbed: false, near: what === "camera" ? scene.camera : scene.lightZone };
    drag.timer = setTimeout(() => {
      if (!drag) return;
      drag.grabbed = true;
      // Manikun wodzi wzrokiem za trzymanym obiektem
      startGaze(drag.what, true);
      if (navigator.vibrate) { try { navigator.vibrate(12); } catch (err) {} }
      ensureLoop();
    }, GRAB_MS);
  });
  preview.addEventListener("pointermove", e => {
    if (!drag) return;
    if (!drag.grabbed) {
      if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 10) { clearTimeout(drag.timer); drag = null; }
      return;
    }
    const p = toSvg(e), G = previewGeom;
    const nx = clamp(p.x / G.W, 0, 1), ny = clamp(p.y / G.H, 0, 1);
    const kx = drag.what === "camera" ? "camX" : "litX", ky = drag.what === "camera" ? "camY" : "litY";
    delete propAnim[kx]; delete propAnim[ky];
    props[kx] = nx; props[ky] = ny;
    const pts = G.zonePts[drag.what];
    drag.near = Object.keys(pts).reduce((a, b) => Math.hypot(pts[a][0] - p.x, pts[a][1] - p.y) <= Math.hypot(pts[b][0] - p.x, pts[b][1] - p.y) ? a : b);
    ensureLoop();
  });
  function endDrag() {
    if (!drag) return;
    clearTimeout(drag.timer);
    const d = drag;
    drag = null;
    if (!d.grabbed) return;
    if (gaze) gaze.hold = false;
    const key = d.what === "camera" ? "camera" : "lightZone";
    if (scene[key] !== d.near) {
      scene[key] = d.near;
      render();
    } else {
      // Ta sama strefa: obiekt wraca na jej środek, Manikun odprowadza go wzrokiem i wraca do pozy
      const tp = targetProps(), now = performance.now();
      (d.what === "camera" ? ["camX", "camY"] : ["litX", "litY"]).forEach(k => { propAnim[k] = { from: props[k], to: tp[k], start: now, dur: 500 }; });
      ensureLoop();
    }
  }
  preview.addEventListener("pointerup", endDrag);
  preview.addEventListener("pointercancel", endDrag);

  const COPY = {
    photo: ["Zdjęcie. Świetnie.", "Ustawiamy jeden kadr."],
    video: ["Wideo. Kamera w ruch.", "Ustawiamy ujęcie z ruchem."]
  };
  // Drugi krok startu: co jest w kadrze. Te same dwa przyciski dostają nową treść.
  const SUBJECT_CHOICES = [
    { id: "object", name: "Obiekt", patch: "#6E8B4A", desc: "Przedmiot na podstawie: światło, tło",
      svg: '<path d="M19 44V22q0-6 4-8V6h4v8q4 2 4 8v22z"/><path d="M9 44h32" class="thin"/><path d="M22 28h6" class="thin"/>' },
    { id: "person", name: "Postać", patch: "#BB5695", desc: "Osoba: poza, ubiór, twarz",
      svg: '<circle cx="24" cy="9" r="5"/><path d="M24 14v16M24 18l-9 8M24 18l9 8M24 30l-7 14M24 30l7 14"/>' }
  ];
  let startStep = "mode";
  function swapToSubject(mode) {
    const fast = reduceMotion.matches;
    dock.classList.add("swap");
    setTimeout(() => {
      document.getElementById("line1").textContent = COPY[mode][0];
      document.getElementById("line2").textContent = "Co będzie w kadrze: przedmiot czy postać?";
      [...dock.querySelectorAll(".choice")].forEach((btn, i) => {
        const c = SUBJECT_CHOICES[i];
        btn.id = "pick-" + c.id;
        btn.dataset.subject = c.id;
        btn.setAttribute("aria-pressed", "false");
        btn.innerHTML = `<svg viewBox="0 0 48 48" class="ink" aria-hidden="true">${c.svg}</svg>`
          + `<span class="name"><span class="patch" style="background:${c.patch}"></span>${c.name}</span><span class="desc">${c.desc}</span>`;
        btn.classList.add("rise");
        btn.style.transitionDelay = (i * 70) + "ms";
      });
      void dock.offsetWidth;
      dock.classList.remove("swap");
      startStep = "subject";
      setTimeout(() => dock.querySelectorAll(".choice").forEach(b => { b.classList.remove("rise"); b.style.transitionDelay = ""; }), 700);
    }, fast ? 0 : 420);
  }
  document.querySelectorAll(".choice").forEach(btn => btn.addEventListener("click", () => {
    if (phase !== "start") return;
    document.querySelectorAll(".choice").forEach(b => b.setAttribute("aria-pressed", String(b === btn)));
    clearTimeout(idleTimer);
    if (startStep === "mode") {
      const mode = btn.dataset.mode;
      document.getElementById("line1").textContent = COPY[mode][0];
      document.getElementById("line2").textContent = COPY[mode][1];
      startStep = "busy";
      scene.mode = mode;
      lastScene = { ...scene, format: { ...scene.format } }; // zmiana trybu na starcie to nie reakcja na kadr
      render();
      playFrames([{ pose: mode === "photo" ? MP.pointLeft : MP.pointRight, dur: 800 }, { pose: mode === "photo" ? MP.pointLeft : MP.pointRight, dur: 250 }]);
      setTimeout(() => swapToSubject(mode), reduceMotion.matches ? 0 : 900);
      return;
    }
    if (startStep !== "subject") return;
    // Postać: Manikun wskazuje i zostaje w kadrze. Obiekt: Manikun znika, a na jego miejscu pojawia się przedmiot.
    startStep = "busy";
    scene.subject = btn.dataset.subject;
    if (scene.subject === "person") playFrames([{ pose: MP.pointLeft, dur: 700 }, { pose: MP.pointLeft, dur: 200 }]);
    render();
    setTimeout(enterDirector, reduceMotion.matches ? 0 : 900);
  }));

  // Kadr zostaje nieruchomo. Kafelki trybu chowają się w dół, a spod spodu wysuwają się
  // ikony kategorii i kafelki formatu. Scena pojawia się wokół Manikuna, a on staje do kadru.
  function enterDirector() {
    const fast = reduceMotion.matches;
    const choices = [...dock.querySelectorAll(".choice")].sort(a => a.getAttribute("aria-pressed") === "true" ? 1 : -1);
    choices.forEach((c, i) => { c.style.transitionDelay = (i * 70) + "ms"; });
    dock.classList.add("leaving");

    propAnim.reveal = { from: props.reveal, to: 1, start: performance.now(), dur: 1100 };
    playFrames([{ pose: curPose(), dur: 1000 }]);

    setTimeout(() => {
      dock.hidden = true;
      barItems.forEach((it, i) => { it.b.style.transitionDelay = (i * STEP_MS) + "ms"; });
      phase = "director";
      appEl.dataset.phase = "director";
      scene.open = "preset";
      render();
    }, fast ? 0 : 480);
    setTimeout(() => barItems.forEach(it => { it.b.style.transitionDelay = ""; }), fast ? 0 : 1400);
  }

  render();
  greet();
  startIdle();
</script>
